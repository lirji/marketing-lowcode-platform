openapi: 3.1.0
info:
  title: Marketing Low-code Platform API
  version: 1.0.0
  description: R1 edge contract. Tenant and organization scope come from the verified identity in OIDC mode.
servers:
  - {url: http://localhost:8080, description: Local edge gateway}
security: [{oidc: []}]
tags:
  - {name: Diagnostics}
  - {name: Control}
  - {name: Release}
  - {name: Compiler}
  - {name: Audience}
  - {name: Decision}
  - {name: Benefit}
  - {name: Event}
  - {name: Journey}
  - {name: Engagement}
  - {name: Measurement}
x-response-templates:
  ok: &ok
    '200': {$ref: '#/components/responses/JsonObject'}
    default: {$ref: '#/components/responses/Problem'}
  list: &list
    '200': {$ref: '#/components/responses/JsonArray'}
    default: {$ref: '#/components/responses/Problem'}
  created: &created
    '201': {$ref: '#/components/responses/JsonObject'}
    default: {$ref: '#/components/responses/Problem'}
  accepted: &accepted
    '202': {$ref: '#/components/responses/JsonObject'}
    default: {$ref: '#/components/responses/Problem'}
paths:
  /api/v1/client-errors:
    post:
      tags: [Diagnostics]
      operationId: collectClientError
      description: >-
        Best-effort authenticated console diagnostics. Tenant comes only from verified identity; no business permission is required.
        Strict UTF-8 JSON, at most 1024 bytes including whitespace, no duplicate keys or trailing JSON.
        Independent per-tenant Redis quota defaults to 5/sec, burst 10; Redis failure closes admission.
        Arbitrary text, message, stack, URL, query, user/tenant/business IDs are forbidden.
        204 means the instance invoked its diagnostic logger and counter; not durable storage or alert delivery.
        No deduplication, automatic retry or idempotency key. Console limits itself to 10 events/minute/page.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientErrorEvent'}
      responses:
        '204': {description: Accepted by local diagnostic logger and counter; no response body}
        '400': {description: CLIENT_ERROR_INPUT_INVALID or CLIENT_ERROR_REQUEST_TOO_LARGE}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {description: TENANT_RATE_LIMITED; Retry-After is 1 second; console does not retry}
        '503': {description: GATEWAY_RATE_LIMITER_UNAVAILABLE; console does not retry}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/referral-rewards/{rewardId}:reevaluate:
    $ref: './referral-operations.yaml#/paths/~1api~1v1~1referral-rewards~1{rewardId}:reevaluate'
  /api/v1/referral-campaigns/{campaignId}/participants:
    $ref: './referral-operations.yaml#/paths/~1api~1v1~1referral-campaigns~1{campaignId}~1participants'
  /api/v1/referral-campaigns/{campaignId}/relations:
    $ref: './referral-operations.yaml#/paths/~1api~1v1~1referral-campaigns~1{campaignId}~1relations'
  /api/v1/referral-campaigns/{campaignId}/rewards:
    $ref: './referral-operations.yaml#/paths/~1api~1v1~1referral-campaigns~1{campaignId}~1rewards'
  /api/v1/referral-campaigns/{campaignId}/summary:
    $ref: './referral-operations.yaml#/paths/~1api~1v1~1referral-campaigns~1{campaignId}~1summary'
  /api/v1/campaigns:
    get:
      tags: [Control]
      operationId: listCampaigns
      parameters:
        - {name: campaignType, in: query, schema: {type: string, enum: [STANDARD, REFERRAL]}}
      responses: *list
    post:
      tags: [Control]
      operationId: createCampaign
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CreateCampaign'}
      responses: *created
  /api/v1/definitions:
    post:
      tags: [Control]
      operationId: saveDefinition
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/SaveDefinition'}
      responses: *created
  /api/v1/definitions/latest:
    get:
      tags: [Control]
      operationId: getLatestDefinition
      parameters:
        - {in: query, name: campaignId, required: true, schema: {type: string}}
        - {in: query, name: dialect, required: true, schema: {type: string, enum: [OFFER_DECISION_DAG, AUDIENCE_EXPRESSION, JOURNEY_STATE_MACHINE, DMN_DECISION_TABLE, BENEFIT_POLICY]}}
      responses: *ok
  /api/v1/definitions/{definitionId}/versions/{version}:
    get:
      tags: [Control]
      operationId: getDefinitionVersion
      parameters: [{$ref: '#/components/parameters/DefinitionId'}, {$ref: '#/components/parameters/Version'}]
      responses: *ok
  /api/v1/definitions/{definitionId}/versions/{version}:validate:
    post:
      tags: [Control]
      operationId: validateDefinition
      parameters: [{$ref: '#/components/parameters/DefinitionId'}, {$ref: '#/components/parameters/Version'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: *ok
  /api/v1/definitions/{definitionId}/versions/{version}:simulate:
    post:
      tags: [Control]
      operationId: simulateDefinition
      parameters: [{$ref: '#/components/parameters/DefinitionId'}, {$ref: '#/components/parameters/Version'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: *ok
  /api/v1/definitions/{definitionId}/versions/{version}:simulate-journey:
    post:
      tags: [Control]
      operationId: simulateJourneyDefinition
      x-required-permission: definition:simulate
      description: |
        Pure simulation of the saved Journey version using the same compiler and state machine.
        No persistence, delivery, grant or webhook effects. Maximum body 64 KiB.
        Events must be ordered by offset; at equal time timers run before events, then input order.
        Does not model production processing-time TTL, scheduler delay or external eligibility.
        Maximum 64 signal advances and 10000 configured node steps; TRUNCATED is not completion.
        Existing graph validation remains required. The general :simulate endpoint rejects Journey.
      parameters: [{$ref: '#/components/parameters/DefinitionId'}, {$ref: '#/components/parameters/Version'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneySimulationRequest'}
      responses:
        '200':
          description: Actual simulated state and proposed command summaries; no effects executed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JourneySimulationResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/definitions/{definitionId}/versions/{version}:submit:
    post:
      tags: [Control]
      operationId: submitDefinition
      parameters: [{$ref: '#/components/parameters/DefinitionId'}, {$ref: '#/components/parameters/Version'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: *ok
  /api/v1/definitions/{definitionId}/versions/{version}/terms:
    get:
      tags: [Control]
      operationId: getDefinitionTerms
      parameters: [{$ref: '#/components/parameters/DefinitionId'}, {$ref: '#/components/parameters/Version'}]
      responses: *ok
  /api/v1/approvals:
    get:
      tags: [Control]
      operationId: listApprovals
      description: Legacy array of at most 100 visible approvals ordered by updatedAt descending. Organization and shop scope are applied before the limit. Use the page endpoint for complete traversal.
      responses: *list
  /api/v1/approvals/page:
    get:
      tags: [Control]
      operationId: listApprovalPage
      description: >-
        Filters tenant, organization, shop and optional status before limiting results.
        Uses descending immutable created_at and case_id order. nextCursor is the last returned caseId
        when hasMore is true. Cursor must remain visible in the current tenant and scope; its status may change.
        This is a live traversal, not a frozen snapshot; refresh from the first page to observe newer records
        or status changes. No total-count or daily-count claim is made. Requires definition:read or an approval role.
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {in: query, name: status, schema: {type: string, enum: [OPEN, APPROVED, REJECTED]}}
        - {in: query, name: cursor, schema: {type: string, minLength: 1, maxLength: 64}}
      responses:
        '200': {description: Visible approval page, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalPage'}}}}
        '400': {description: APPROVAL_QUERY_INVALID or APPROVAL_CURSOR_INVALID; refresh after cursor invalidation, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/approvals/{caseId}/decisions:
    post:
      tags: [Control]
      operationId: decideApproval
      parameters: [{$ref: '#/components/parameters/CaseId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ApprovalDecision'}
      responses: *ok
  /api/v1/registries/nodes:
    get: {tags: [Control], operationId: listNodeDefinitions, responses: *list}
  /api/v1/releases/page:
    get:
      tags: [Release]
      operationId: listReleasePage
      x-required-permission: release:read
      description: >-
        Filters tenant, organization, shop and optional state before limiting results.
        Uses descending immutable created_at and manifest_id order. nextCursor is the last returned manifestId
        when hasMore is true. Cursor must remain visible in the current tenant and scope; its state may change.
        This is a live traversal, not a frozen snapshot; refresh from the first page to observe newer records
        or state changes. No total-count or daily-count claim is made. Requires release:read.
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {in: query, name: state, schema: {type: string, enum: [STAGED, ACTIVE, ROLLED_BACK, REVOKED]}}
        - {in: query, name: cursor, schema: {type: string, minLength: 1, maxLength: 64}}
      responses:
        '200': {description: Visible release page, content: {application/json: {schema: {$ref: '#/components/schemas/ReleasePage'}}}}
        '400': {description: RELEASE_QUERY_INVALID or RELEASE_CURSOR_INVALID; refresh after cursor invalidation, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/releases:
    get:
      tags: [Release]
      operationId: listReleases
      description: Legacy array of at most 50 visible manifests; scope filters run before limiting. Use /releases/page for complete traversal.
      x-required-permission: release:read
      responses: *list
    post:
      tags: [Release]
      operationId: stageRelease
      description: Stage only an approved, compiler-attested artifact closure. Offer artifacts are rejected unless every frozen BenefitDefinition version is ACTIVE and remains bound to an ACTIVE same-tenant SKU.
      x-required-permission: release:write
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/StageRelease'}
      responses:
        '201': {$ref: '#/components/responses/JsonObject'}
        '409':
          description: RELEASE_NOT_APPROVED, APPROVAL_CASE_INVALID, BENEFIT_RELEASE_UNBOUND, BENEFIT_RELEASE_NOT_ACTIVE, SKU_NOT_ACTIVE, BENEFIT_SKU_TYPE_MISMATCH, or artifact closure/provenance rejection.
          content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/releases/{manifestId}:
    get:
      tags: [Release]
      operationId: getRelease
      description: Read one manifest and current ACK readiness by ID, independent of list pagination. Rechecks tenant, release:read and the frozen definition organization/shop scope on every read. This never creates an ACK or activation.
      x-required-permission: release:read
      parameters: [{$ref: '#/components/parameters/ManifestId'}]
      responses:
        '200': {description: Current visible release, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseView'}}}}
        '400': {description: INVALID_ARGUMENT for organization/shop scope rejection under the existing TenantScope contract, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '403': {description: Read permission denied, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '404': {description: MANIFEST_NOT_FOUND or RELEASE_DEFINITION_NOT_FOUND, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/releases/{manifestId}:ack:
    post:
      tags: [Release]
      operationId: acknowledgeRelease
      x-required-permission: runtime:ack
      parameters: [{$ref: '#/components/parameters/ManifestId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeAck'}}}}
      responses: *ok
  /api/v1/releases/{manifestId}:activate:
    post:
      tags: [Release]
      operationId: activateRelease
      description: Activation is allowed only after a trusted READY runtime ACK satisfies quorum and capacity.
      x-required-permission: release:activate
      parameters: [{$ref: '#/components/parameters/ManifestId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: *ok
  /api/v1/releases/{manifestId}:rollback:
    post:
      tags: [Release]
      operationId: rollbackRelease
      x-required-permission: release:rollback
      parameters: [{$ref: '#/components/parameters/ManifestId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: *ok
  /api/v1/releases/{manifestId}/rollback-candidates:
    get:
      tags: [Release]
      operationId: getRollbackCandidates
      x-required-permission: release:read
      description: Read at most 10 retained targets for the currently desired ACTIVE source. Targets must have been ACTIVE, be unexpired, executable and within current campaign access scope. This is a read-time snapshot; rollback rechecks source, target and permission. Activation and rollback also recheck current access before idempotent replay.
      parameters: [{$ref: '#/components/parameters/ManifestId'}]
      responses:
        '200': {description: Eligible retained versions, content: {application/json: {schema: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/RollbackCandidate'}}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/releases/desired:
    get:
      tags: [Release]
      operationId: getDesiredRelease
      parameters:
        - {in: query, name: environment, required: true, schema: {type: string}}
        - {in: query, name: cell, required: true, schema: {type: string}}
        - {in: query, name: runtime, required: true, schema: {type: string}}
        - {in: query, name: namespace, required: true, schema: {type: string}}
      responses: *ok
  /api/v1/releases/kill-switches/{namespace}:
    put:
      tags: [Release]
      operationId: setKillSwitch
      x-required-permission: release:kill-switch
      parameters: [{in: path, name: namespace, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: *ok
  /api/v1/compile:
    post:
      tags: [Compiler]
      operationId: compileArtifact
      description: Compile the exact approved graph version into a signed immutable artifact. A valid=false report is not stageable.
      x-required-permission: definition:compile
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CompileRequest'}}}}
      responses:
        '200': {description: Deterministic compiler report, content: {application/json: {schema: {$ref: '#/components/schemas/CompileReport'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/campaigns/{campaignId}/release-bundles:
    post:
      tags: [Release]
      operationId: prepareReleaseBundle
      x-required-permission: release:write
      description: >-
        Freeze 2-8 signed staged manifests from the same campaign, environment and cell.
        Only PREPARING is supported; this operation does not activate runtimes or emit activation events.
        Every member slot is persistently managed as a bundle. All manifests in those complete tenant/environment/cell/runtime/namespace slots are protected from standalone activation, rollback and rollback-candidate lookup (409 RELEASE_BUNDLE_REQUIRED), including old command receipt replay. Existing active pointers are unchanged.
        Current campaign scope is checked before replay. Sorted member IDs, campaign and actor enter the command fingerprint.
        Body limit is 16 KiB before parsing. Partial canaries are not supported.
      parameters:
        - {in: path, name: campaignId, required: true, schema: {type: string, maxLength: 64}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, manifestIds]
              properties:
                expectedVersion: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775806}
                manifestIds:
                  type: array
                  minItems: 2
                  maxItems: 8
                  uniqueItems: true
                  items: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$'}
      responses:
        '201': {description: Immutable preparing bundle or original idempotent receipt, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseBundleView'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/campaigns/{campaignId}/release-bundles/latest:
    get:
      tags: [Release]
      operationId: getLatestReleaseBundle
      x-required-permission: release:read
      parameters:
        - {in: path, name: campaignId, required: true, schema: {type: string, maxLength: 64}}
      responses:
        '200': {description: Latest stored preparation version, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseBundleView'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/campaigns/{campaignId}/release-bundles/versions/{version}:
    get:
      tags: [Release]
      operationId: getReleaseBundleVersion
      x-required-permission: release:read
      parameters:
        - {in: path, name: campaignId, required: true, schema: {type: string, maxLength: 64}}
        - {in: path, name: version, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200': {description: Immutable historical preparation version, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseBundleView'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/campaigns/{campaignId}/release-bundles/versions/{version}/acks:
    post:
      tags: [Release]
      operationId: acknowledgeReleaseBundle
      x-required-permission: runtime:ack
      description: >-
        Records complete doubly signed bundle evidence within the current campaign scope.
        Maximum body size is 16 KiB, with authorization before parsing. Legacy single-manifest ACKs are rejected.
        Each member allows up to 64 runtime identities. Exact duplicates and older valid evidence return current readiness;
        same identity and timestamp with different signed content returns 409. Evidence and audit commit together.
        Does not activate a bundle or change immutable preparation history.
      parameters:
        - {in: path, name: campaignId, required: true, schema: {type: string, maxLength: 64}}
        - {in: path, name: version, required: true, schema: {type: integer, format: int64, minimum: 1}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseBundleAck'}}}}
      responses:
        '200': {description: Current per-member readiness after accepting or ignoring duplicate/older evidence, content: {application/json: {schema: {$ref: '#/components/schemas/BundleReadinessView'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/campaigns/{campaignId}/release-bundles/versions/{version}/readiness:
    get:
      tags: [Release]
      operationId: getReleaseBundleReadiness
      x-required-permission: release:read
      description: >-
        Rechecks current campaign scope, trust, five-minute ACK freshness, artifact closure, allowed build and
        each member's replica/capacity quorum. Invalid or stale evidence is visible as ignoredEvidence.
        runtimeReady can expire and is never an activation authorization. No state is changed by this read.
      parameters:
        - {in: path, name: campaignId, required: true, schema: {type: string, maxLength: 64}}
        - {in: path, name: version, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200': {description: Current runtime preparation conditions only, content: {application/json: {schema: {$ref: '#/components/schemas/BundleReadinessView'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/campaigns/{campaignId}/release-bundles/versions/{version}/manifest:
    get:
      tags: [Release]
      operationId: getReleaseBundleManifest
      x-required-permission: release:read
      description: >-
        Signs the frozen complete bundle with an explicit protocol purpose. Current campaign scope is required.
        This proves content provenance only and never authorizes activation. Expired members return 409.
        Signing-key rotation may change the outer signature; bundle version, content hash and history remain unchanged.
      parameters:
        - {in: path, name: campaignId, required: true, schema: {type: string, maxLength: 64}}
        - {in: path, name: version, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200': {description: Signed complete preparation manifest, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseBundleManifest'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/campaigns/{campaignId}/dmn-drafts:
    post:
      tags: [Control]
      operationId: saveDmnDraft
      x-required-permission: definition:write
      parameters:
        - {in: path, name: campaignId, required: true, schema: {type: string, maxLength: 64}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      description: Save an immutable campaign-scoped draft, including incomplete cells. expectedVersion is 0 before first save. Current campaign scope and write permission are rechecked before idempotent replay. Conflicting base returns 409 DMN_DRAFT_VERSION_CONFLICT. No approval or publication is implied. Bodies above 512 KiB return 400 DMN_DRAFT_REQUEST_TOO_LARGE before JSON parsing.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DmnDraftSaveRequest'}}}}
      responses:
        '200': {description: Immutable draft version, content: {application/json: {schema: {$ref: '#/components/schemas/DmnDraftView'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/campaigns/{campaignId}/dmn-drafts/latest:
    get:
      tags: [Control]
      operationId: getLatestDmnDraft
      x-required-permission: definition:read
      parameters:
        - {in: path, name: campaignId, required: true, schema: {type: string, maxLength: 64}}
      description: Read under current tenant, organization and shop scope; missing version returns 404 DMN_DRAFT_NOT_FOUND.
      responses:
        '200': {description: Immutable draft version, content: {application/json: {schema: {$ref: '#/components/schemas/DmnDraftView'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/campaigns/{campaignId}/dmn-drafts/versions/{version}:
    get:
      tags: [Control]
      operationId: getDmnDraftVersion
      x-required-permission: definition:read
      parameters:
        - {in: path, name: campaignId, required: true, schema: {type: string, maxLength: 64}}
        - {in: path, name: version, required: true, schema: {type: integer, format: int64, minimum: 1}}
      description: Read under current tenant, organization and shop scope; missing version returns 404 DMN_DRAFT_NOT_FOUND.
      responses:
        '200': {description: Immutable draft version, content: {application/json: {schema: {$ref: '#/components/schemas/DmnDraftView'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/dmn/analyze:
    post:
      tags: [Compiler]
      operationId: analyzeDmnTable
      x-required-permission: definition:compile
      description: Analyze a bounded structured table using KIE; no persistence or publication. Arbitrary XML and FEEL expressions are not accepted. JSON bodies above 512 KiB return 400 with DMN_REQUEST_TOO_LARGE before parsing.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DmnAnalyzeRequest'}}}}
      responses:
        '200': {description: Actual engine analysis including gaps and overlaps, content: {application/json: {schema: {$ref: '#/components/schemas/DmnAnalysis'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/dmn/evaluate:
    post:
      tags: [Compiler]
      operationId: evaluateDmnTable
      x-required-permission: definition:simulate
      description: Evaluate without business side effects. Context keys must exactly match inputs; scalar values are strings and parsed according to column type. Busy capacity returns 503 with DMN_WORKBENCH_BUSY.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DmnEvaluateRequest'}}}}
      responses:
        '200': {description: Actual engine result; no-match may contain null and is not a successful rule match, content: {application/json: {schema: {$ref: '#/components/schemas/DmnEvaluation'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/artifacts/{artifactId}:
    get:
      tags: [Compiler]
      operationId: getArtifact
      x-required-permission: artifact:read
      parameters: [{$ref: '#/components/parameters/ArtifactId'}]
      responses:
        '200': {description: Signed artifact and provenance used to build the stage request, content: {application/json: {schema: {$ref: '#/components/schemas/ArtifactView'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/fields:
    get: {tags: [Audience], operationId: listAudienceFields, responses: *list}
    post: {tags: [Audience], operationId: registerAudienceField, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: *created}
  /api/v1/audiences:
    get: {tags: [Audience], operationId: listAudiences, responses: *list}
    post: {tags: [Audience], operationId: createAudience, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: *created}
  /api/v1/audiences/page:
    get:
      tags: [Audience]
      operationId: listAudiencePage
      x-required-permission: audience:read
      description: >-
        Read the latest version of each segment under the authenticated tenant, ordered by segment ID ascending.
        Search is applied before the limit, case-insensitive literal substring matching on name, ID, version,
        rule hash, creation time displayed as yyyy/MM/dd HH:mm:ss in Beijing (UTC+08:00), and raw or Chinese
        status (ACTIVE 已生效, READY 已就绪, DRAFT 草稿, STALE 已过期). Percent and underscore are literal.
        q is trimmed and echoed as query. Cursor is the previous page's final ID and must exist in this tenant,
        independently of q. Invalid query returns 400 AUDIENCE_QUERY_INVALID; invalid or foreign cursor returns
        400 AUDIENCE_CURSOR_INVALID. This is not a snapshot across requests: updated versions keep the same ID
        position; newly inserted earlier IDs require refreshing. The legacy array endpoint remains unchanged.
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {in: query, name: cursor, schema: {type: string, minLength: 1, maxLength: 128}}
        - {in: query, name: q, schema: {type: string, maxLength: 128, default: ''}}
      responses:
        '200': {description: Bounded current audience page, content: {application/json: {schema: {$ref: '#/components/schemas/AudiencePage'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/audiences/{segmentId}/versions/{version}:preview:
    post:
      tags: [Audience]
      operationId: previewAudience
      parameters: [{$ref: '#/components/parameters/SegmentId'}, {$ref: '#/components/parameters/Version'}]
      requestBody: {$ref: '#/components/requestBodies/JsonArray'}
      responses: *ok
  /api/v1/audiences/{segmentId}/versions/{version}/snapshots:
    post:
      tags: [Audience]
      operationId: createAudienceSnapshot
      description: >-
        Imports an explicit member baseline, not a full-population rule calculation.
        Initial memberCount/checksum describe creation; later membership updates do not rewrite that baseline.
        At most 10000 distinct nonblank subjects; watermark <= asOf < expiresAt and creation must precede expiresAt.
        An optional Idempotency-Key replays the original response within command retention. Identity includes
        tenant, segmentId, version, the unordered member set and timestamps; conflicting reuse returns 409.
        Omitting the key retains the legacy non-idempotent behavior. Snapshot IDs are not segment IDs and
        creation alone does not publish membership to Decision.
      parameters:
        - {$ref: '#/components/parameters/SegmentId'}
        - {$ref: '#/components/parameters/Version'}
        - {in: header, name: Idempotency-Key, required: false, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: *created
  /api/v1/audiences/snapshots/{snapshotId}/memberships:
    put:
      tags: [Audience]
      operationId: updateAudienceMembership
      description: >-
        subjectToken must be nonblank, version must be positive, and member must be an explicit boolean.
        Unique-key arbitration applies only newer versions, including concurrent first writes.
        Older updates return the actual current member/version with STALE_UPDATE_IGNORED.
        The same version with a different member value returns 409 AUDIENCE_MEMBERSHIP_VERSION_CONFLICT;
        the same version/value is an idempotent replay. These updates do not freeze snapshot membership.
      parameters: [{$ref: '#/components/parameters/SnapshotId'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: *ok
  /api/v1/audiences/snapshots/{snapshotId}/memberships/{subjectToken}:
    get:
      tags: [Audience]
      operationId: getAudienceMembership
      description: At usedAt equal to or later than expiresAt, the requested stalePolicy applies. usedAt is an explicit historical lookup time, not an assertion of current eligibility.
      parameters:
        - {$ref: '#/components/parameters/SnapshotId'}
        - {$ref: '#/components/parameters/SubjectToken'}
        - {in: query, name: usedAt, required: true, schema: {type: string, format: date-time}}
        - {in: query, name: stalePolicy, required: true, schema: {type: string, enum: [REJECT_CANDIDATE, USE_LAST_GOOD, GENERIC_PATH]}}
      responses: *ok
  /api/v1/decisions:evaluate:
    post: {tags: [Decision], operationId: evaluateDecision, requestBody: {$ref: '#/components/requestBodies/Decision'}, responses: *ok}
  /api/v1/decisions:batch-evaluate:
    post:
      tags: [Decision]
      operationId: batchEvaluateDecision
      requestBody:
        required: true
        content: {application/json: {schema: {type: array, minItems: 1, maxItems: 50, items: {$ref: '#/components/schemas/UnboundDecisionRequest'}}}}
      responses: *list
  /api/v1/decisions/bundle-participations:
    post:
      tags: [Decision]
      operationId: admitBundleParticipation
      summary: Persist one immutable whole-bundle binding for a trusted business participation
      description: Internal machine entry requiring bundle:admit and the current organization/shop scope of the signed source. Strict JSON up to 8KiB. The tenant and environment/cell come from authentication/server configuration. The business participation key is permanently idempotent; another subject conflicts. Only an actual applied pointer can admit a new participant; RECORDED alone cannot. Returns the original persisted proof on replay without extending eligibility. A trusted Auth/member mapping adapter is required before C-end integration; callers cannot supply a version or bypass that mapping.
      x-required-permission: 'bundle:admit'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseBundleAdmissionRequest'}}}
      responses:
        '200':
          description: Persisted signed participation, identical for the same existing business binding
          content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseBundleParticipation'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/decisions/bundle:evaluate:
    post:
      tags: [Decision]
      operationId: evaluateBundleDecision
      description: Requires decision:evaluate and current organization/shop scope. The signed participation pins the exact bundle member; no latest fallback. Missing context is 400; untrusted context is 409. Old services return 404 on this dedicated URL; callers must never downgrade to the legacy URL.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BundleDecisionRequest'}}}
      responses: *ok
  /api/v1/decisions/bundle:batch-evaluate:
    post:
      tags: [Decision]
      operationId: batchEvaluateBundleDecision
      description: Every item requires a signed participation; same validation as the single bundle endpoint. Each item retains independent idempotency, and the batch is not atomic.
      requestBody:
        required: true
        content: {application/json: {schema: {type: array, minItems: 1, maxItems: 50, items: {$ref: '#/components/schemas/BundleDecisionRequest'}}}}
      responses: *list
  /api/v1/decisions/runtime/release-bundle-directives:
    post:
      operationId: recordDecisionBundleDirective
      summary: Persist a signed whole-bundle authorization without changing online routing
      description: Requires runtime:activate. Strict JSON up to 1MiB. Verifies trusted complete signatures and the exact persisted local member. Same sequence and same content replay; conflicts or unknown stale sequences return 409. RECORDED is not READY or APPLIED.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReleaseBundleActivationDirective'}
      responses:
        '200':
          description: Durable receipt only; existing routing pointers are unchanged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordedBundleDirective'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/decisions/runtime/release-bundle-directives/{campaignId}/latest:
    get:
      operationId: getLatestRecordedDecisionBundleDirective
      summary: Recover the latest durable bundle authorization receipt
      description: Requires runtime:activate for the trusted tenant and configured runtime slot. Expired authorization remains readable as history; reading does not extend validity or apply it.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$'}
      responses:
        '200':
          description: Highest recorded sequence, not current online state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordedBundleDirective'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/decisions/runtime/release-bundles:prepare:
    post:
      tags: [Decision]
      operationId: prepareDecisionReleaseBundle
      x-required-permission: runtime:warm
      description: >-
        Verifies the complete signed bundle, trusted tenant, expiry and exact locally persisted member.
        Revalidates stored artifact bytes, compiler signature and executable structure before issuing a bundle-bound ACK.
        Does not install artifacts or move the active pointer. Retries recheck storage and issue fresh evidence.
        The raw JSON body is limited to 1 MiB after authorization and before parsing; unknown fields are rejected.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseBundlePrepareRequest'}}}}
      responses:
        '200': {description: Signed evidence for this exact bundle and member only, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseBundleAck'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/decisions/runtime/manifest:
    put: {tags: [Decision], operationId: warmDecisionRuntime, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: *ok}
  /api/v1/decisions/runtime/activation:
    put: {tags: [Decision], operationId: activateDecisionRuntime, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: *ok}
  /api/v1/decisions/runtime/ack:
    post: {tags: [Decision], operationId: refreshDecisionRuntimeAck, responses: *ok}
  /api/v1/decisions/runtime/audience-membership:
    put: {tags: [Decision], operationId: updateDecisionAudienceProjection, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: *ok}
  /api/v1/funding/accounts:
    get: {tags: [Benefit], operationId: listFundingAccounts, responses: *list}
