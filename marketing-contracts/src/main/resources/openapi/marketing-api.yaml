    put: {tags: [Journey], operationId: warmJourneyRuntime, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: *ok}
  /api/v1/journey-runtime/activation:
    put: {tags: [Journey], operationId: activateJourneyRuntime, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: *ok}
  /api/v1/journeys/{journeyId}/versions/{version}:
    put:
      tags: [Journey]
      operationId: registerJourneyForDevelopment
      description: DEV only; production installs a signed artifact through the runtime manifest endpoint.
      parameters: [{$ref: '#/components/parameters/JourneyId'}, {$ref: '#/components/parameters/Version'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: *ok
  /api/v1/enrollments:
    get:
      tags: [Journey]
      operationId: listJourneyEnrollments
      parameters:
        - {in: query, name: status, required: false, schema: {type: string, enum: [RUNNING, WAITING, COMPLETED, FAILED]}}
        - {in: query, name: journeyId, required: false, schema: {type: string}}
        - {in: query, name: limit, required: false, schema: {type: integer, default: 50, minimum: 1, maximum: 200}}
      responses: *list
    post:
      tags: [Journey]
      operationId: enrollJourneyForDevelopment
      description: DIRECT/DEV only; production submits a JOURNEY_SIGNAL START envelope to POST /api/v1/events.
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: *created
  /api/v1/enrollments/{enrollmentId}/signals:
    post:
      tags: [Journey]
      operationId: signalJourneyForDevelopment
      description: DIRECT/DEV only; production uses POST /api/v1/events so Flink is the only state writer.
      parameters: [{$ref: '#/components/parameters/EnrollmentId'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: *ok
  /api/v1/enrollments/{enrollmentId}:
    get: {tags: [Journey], operationId: getJourneyEnrollment, parameters: [{$ref: '#/components/parameters/EnrollmentId'}], responses: *ok}
  /api/v1/journeys/{journeyId}:migrate:
    post:
      tags: [Journey]
      operationId: migrateJourneyForDevelopment
      description: DIRECT/DEV only; production stream state stays version-pinned and is migrated with savepoints.
      parameters: [{$ref: '#/components/parameters/JourneyId'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: *ok
  /api/v1/consents:
    put: {tags: [Engagement], operationId: setConsent, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: *ok}
  /api/v1/consents/suppressions:
    put: {tags: [Engagement], operationId: setSuppression, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: *ok}
  /api/v1/contacts/frequency-policies:
    put: {tags: [Engagement], operationId: setFrequencyPolicy, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: *ok}
  /api/v1/templates/catalog/page:
    get:
      tags: [Template]
      operationId: listTemplatePage
      x-required-permission: template:read
      description: >-
        Read the latest version of each template under the authenticated tenant, ordered by template ID ascending.
        Search is applied before the limit, case-insensitive literal substring matching on ID, displayed v-prefixed version, channel, required variables (comma-space joined, 无 when empty), creation time displayed as yyyy/MM/dd HH:mm:ss in Beijing (UTC+08:00), and raw or Chinese
        status (APPROVED 已批准). Content is returned for details but is not searched. Percent and underscore are literal.
        q is trimmed and echoed as query. Cursor is the previous page's final ID and must exist in this tenant,
        independently of q. Invalid query returns 400 TEMPLATE_QUERY_INVALID; invalid or foreign cursor returns
        400 TEMPLATE_CURSOR_INVALID. This is not a snapshot across requests: updated versions keep the same ID
        position; newly inserted earlier IDs require refreshing. The legacy array endpoint remains unchanged.
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {in: query, name: cursor, schema: {type: string, minLength: 1, maxLength: 128}}
        - {in: query, name: q, schema: {type: string, maxLength: 128, default: ''}}
      responses:
        '200': {description: Bounded current template page, content: {application/json: {schema: {$ref: '#/components/schemas/TemplatePage'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/templates:
    get: {tags: [Engagement], operationId: listTemplates, responses: *list}
    post:
      tags: [Engagement]
      operationId: createTemplate
      description: >-
        Requires current template:write permission, including idempotent replay. Creates
        an immutable tenant/templateId/version row with the existing APPROVED state;
        it does not send a message or update existing Journey references. Duplicate
        versions return 409 TEMPLATE_VERSION_EXISTS without overwriting content.
        Invalid bounded input returns 400 TEMPLATE_INPUT_INVALID. EMAIL content must
        contain unsubscribe or returns 409 UNSUBSCRIBE_NOTICE_REQUIRED. Same key and
        payload replays the saved result; a changed payload returns 409 IDEMPOTENCY_PAYLOAD_CONFLICT.
        Channels remain server-configured string identifiers, not a promise of delivery support.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemplateCreate'}
      responses: *created
  /api/v1/contacts:
    get:
      tags: [Engagement]
      operationId: listContacts
      parameters:
        - {in: query, name: state, required: false, schema: {type: string, enum: [PENDING, RETRY_PENDING, ACCEPTED, SENT, DELIVERED, FAILED, CLICKED, UNSUBSCRIBED]}}
        - {in: query, name: limit, required: false, schema: {type: integer, default: 50, minimum: 1, maximum: 200}}
      responses: *list
    post:
      tags: [Engagement]
      operationId: sendContact
      description: >-
        contactKey is scoped to the verified tenant and permanently binds the original
        subject, campaign, channel, recipient, template/version, variables, timezone,
        personalization flag and requestedAt. Object key order is ignored; changed
        payloads return 409 IDEMPOTENCY_PAYLOAD_CONFLICT even after completion.
        requestedAt is business metadata; frequency limits use server admission time.
        Historical PENDING/RETRY_PENDING rows without a request fingerprint return
        409 CONTACT_RETRY_UNVERIFIABLE and require channel-result review before recovery;
        historical rows in other states can still be read without another provider call.
        The provider endpoint is selected by the server. Delivery acknowledgments do
        not regress states already advanced by provider callbacks.
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: *accepted
  /api/v1/contacts/{contactKey}:
    get: {tags: [Engagement], operationId: getContact, parameters: [{$ref: '#/components/parameters/ContactKey'}], responses: *ok}
  /api/v1/providers/callbacks:
    post:
      tags: [Engagement]
      operationId: receiveProviderCallback
      parameters:
        - {in: header, name: X-Marketing-Provider-Request-Id, required: true, schema: {type: string}}
        - {in: header, name: X-Marketing-Timestamp, required: true, schema: {type: string, format: date-time}}
        - {in: header, name: X-Marketing-Signature, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: *ok
  /api/v1/experiments:
    post: {tags: [Measurement], operationId: createExperiment, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: *created}
  /api/v1/experiments/{experimentId}/versions/{version}:assign:
    post: {tags: [Measurement], operationId: assignExperiment, parameters: [{$ref: '#/components/parameters/ExperimentId'}, {$ref: '#/components/parameters/StringVersion'}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: *ok}
  /api/v1/experiments/{experimentId}/versions/{version}:check-srm:
    post: {tags: [Measurement], operationId: checkExperimentSrm, parameters: [{$ref: '#/components/parameters/ExperimentId'}, {$ref: '#/components/parameters/StringVersion'}], responses: *ok}
  /api/v1/measurements/facts:
    post: {tags: [Measurement], operationId: ingestMeasurementFact, requestBody: {$ref: '#/components/requestBodies/MarketingFact'}, responses: *accepted}
  /api/v1/measurements/watermarks:
    post: {tags: [Measurement], operationId: advanceMeasurementWatermark, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: *ok}
  /api/v1/measurements/dashboard:
    get:
      tags: [Measurement]
      operationId: getMeasurementDashboard
      description: Requires measurement:read for the current tenant. Optional campaignId narrows projection rows only; corrections retain their signed deltas. Omitted campaignId includes unassigned facts. Watermark remains tenant-wide. Response echoes the applied filter; clients must not treat a missing echo from an old server as filtered data.
      parameters:
        - {in: query, name: from, required: true, schema: {type: string, format: date-time}}
        - {in: query, name: to, required: true, schema: {type: string, format: date-time}}
        - {$ref: '#/components/parameters/MeasurementCampaignFilter'}
      responses:
        '200': {description: Dashboard for the requested tenant/time/campaign scope, content: {application/json: {schema: {$ref: '#/components/schemas/MeasurementDashboard'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/measurements/series:
    get:
      tags: [Measurement]
      operationId: getMeasurementSeries
      description: Requires measurement:read. Uses the same tenant/time/campaign predicate as dashboard, with zero-filled hour or UTC calendar-day buckets and a maximum range of 366 days. Returns campaignId echo. Neither endpoint filters by attribution policy.
      parameters:
        - {in: query, name: from, required: true, schema: {type: string, format: date-time}}
        - {in: query, name: to, required: true, schema: {type: string, format: date-time}}
        - {in: query, name: granularity, required: true, schema: {type: string, enum: [hour, day]}}
        - {$ref: '#/components/parameters/MeasurementCampaignFilter'}
      responses:
        '200': {description: Filtered series including empty buckets, content: {application/json: {schema: {$ref: '#/components/schemas/MeasurementSeries'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/measurements/attribution:recompute:
    post:
      tags: [Measurement]
      operationId: recomputeAttribution
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses: *ok
  /api/v1/measurements/attribution/{conversionEventId}:
    get:
      tags: [Measurement]
      operationId: getAttribution
      parameters:
        - {in: path, name: conversionEventId, required: true, schema: {type: string}}
        - {in: query, name: policy, required: true, schema: {type: string, enum: [FIRST_TOUCH, LAST_TOUCH, LINEAR]}}
        - {in: query, name: windowSeconds, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses: *ok
  /api/v1/decisions/traces/requests/{requestId}:
    get:
      tags: [Decision]
      operationId: getAutomaticDecisionTraceByRequest
      description: Requires trace:read. Reads the newest decision-time snapshot from the configured JDBC or Redis idempotency authority. Visible for at most the existing 24-hour window. Legacy records without a trace return 404; no fulfillment events are inferred.
      parameters:
        - {in: path, name: requestId, required: true, schema: {type: string, minLength: 1}}
      responses:
        '200': {description: Sanitized decision snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/AutomaticDecisionTrace'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/decisions/traces/orders/{orderId}:
    get:
      tags: [Decision]
      operationId: getAutomaticDecisionTraceByOrder
      description: Requires trace:read. Returns the newest decision-time snapshot for this order within the same tenant. This is not order confirmation or award delivery. Ties are ordered by quoteId.
      parameters:
        - {in: path, name: orderId, required: true, schema: {type: string, minLength: 1}}
      responses:
        '200': {description: Sanitized decision snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/AutomaticDecisionTrace'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/traces:
    post: {tags: [Measurement], operationId: recordDecisionTrace, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: *created}
  /api/v1/traces/requests/{requestId}:
    get: {tags: [Measurement], operationId: getTraceByRequest, parameters: [{$ref: '#/components/parameters/RequestId'}], responses: *ok}
  /api/v1/traces/orders/{orderId}:
    get: {tags: [Measurement], operationId: getTraceByOrder, parameters: [{$ref: '#/components/parameters/OrderId'}], responses: *ok}
components:
  securitySchemes:
    oidc: {type: openIdConnect, openIdConnectUrl: https://identity.example.invalid/.well-known/openid-configuration}
  parameters:
    MeasurementCampaignFilter:
      in: query
      name: campaignId
      required: false
      description: Exact persisted campaign ID. Omit for all campaigns. Blank, overlong, surrounding whitespace or control characters return MEASUREMENT_CAMPAIGN_FILTER_INVALID. Unknown IDs return zero results within the tenant, without cross-service lookup.
      schema: {type: string, minLength: 1, maxLength: 128}
    IdempotencyKey: {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 8, maxLength: 128, pattern: '^[a-zA-Z0-9_.:-]+$'}}
    DefinitionId: {in: path, name: definitionId, required: true, schema: {type: string}}
    Version: {in: path, name: version, required: true, schema: {type: integer, format: int64, minimum: 1}}
    StringVersion: {in: path, name: version, required: true, schema: {type: string}}
    CaseId: {in: path, name: caseId, required: true, schema: {type: string}}
    ManifestId: {in: path, name: manifestId, required: true, schema: {type: string}}
    ArtifactId: {in: path, name: artifactId, required: true, schema: {type: string}}
    SegmentId: {in: path, name: segmentId, required: true, schema: {type: string}}
    SnapshotId: {in: path, name: snapshotId, required: true, schema: {type: string}}
    SubjectToken: {in: path, name: subjectToken, required: true, schema: {type: string}}
    ResourceKey: {in: path, name: resourceKey, required: true, schema: {type: string}}
    BenefitId: {in: path, name: benefitId, required: true, schema: {type: string}}
    ApplicationId: {in: path, name: applicationId, required: true, schema: {type: string}}
    QuarantineId: {in: path, name: quarantineId, required: true, schema: {type: string}}
    JourneyId: {in: path, name: journeyId, required: true, schema: {type: string}}
    EnrollmentId: {in: path, name: enrollmentId, required: true, schema: {type: string}}
    ContactKey: {in: path, name: contactKey, required: true, schema: {type: string, minLength: 1}}
    ExperimentId: {in: path, name: experimentId, required: true, schema: {type: string}}
    RequestId: {in: path, name: requestId, required: true, schema: {type: string}}
    OrderId: {in: path, name: orderId, required: true, schema: {type: string}}
  requestBodies:
    JsonObject: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}
    JsonArray: {required: true, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/JsonObject'}}}}}
    CreateCampaign: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateCampaign'}}}}
    SaveDefinition: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SaveDefinition'}}}}
    ApprovalDecision: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalDecision'}}}}
    StageRelease: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageReleaseRequest'}}}}
    Decision: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UnboundDecisionRequest'}}}}
    ReservePromotion: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReservePromotionRequest'}}}}
    InboundEvent: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InboundEvent'}}}}
    MarketingFact: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MeasurementFactRequest'}}}}
  responses:
    JsonObject: {description: Successful response, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}
    JsonArray: {description: Successful collection, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/JsonObject'}}}}}
    Problem: {description: RFC 9457 problem response, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    BundleReadinessView:
      type: object
      additionalProperties: false
      required: [bundleId, version, contentHash, runtimeReady, checkedAt, expiresAt, members]
      properties:
        bundleId: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        contentHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        runtimeReady: {type: boolean}
        checkedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        members:
          type: array
          minItems: 2
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [manifestId, runtime, namespace, readyReplicas, readyCapacity, ignoredEvidence, runtimeReady]
            properties:
              manifestId: {type: string}
              runtime: {type: string}
              namespace: {type: string}
              readyReplicas: {type: integer, minimum: 0, maximum: 64}
              readyCapacity: {type: integer, format: int64, minimum: 0}
              ignoredEvidence: {type: integer, minimum: 0, maximum: 64}
              runtimeReady: {type: boolean}
    ReleaseBundlePrepareRequest:
      type: object
      additionalProperties: false
      required: [bundle, memberManifestId]
      properties:
        bundle: {$ref: '#/components/schemas/ReleaseBundleManifest'}
        memberManifestId: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$'}
    ReleaseBundleAck:
      type: object
      additionalProperties: false
      required: [bundleId, campaignId, version, contentHash, memberSignature, runtimeAck, signature]
      properties:
        bundleId: {type: string, maxLength: 64}
        campaignId: {type: string, maxLength: 64}
        version: {type: integer, format: int64, minimum: 1}
        contentHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        memberSignature: {type: string, minLength: 1}
        runtimeAck:
          allOf:
            - {$ref: '#/components/schemas/RuntimeAck'}
            - type: object
              properties:
                status: {type: string, const: READY}
                capacity: {type: integer, format: int64, minimum: 1}
                signature: {type: string, minLength: 1}
        signature: {type: string, minLength: 1, description: Independent purpose signature covering all bundle fields and the complete inner READY ACK}
    RecordedBundleDirective:
      type: object
      additionalProperties: false
      required: [state, directive, latestSequence, current, recordedAt]
      properties:
        state: {type: string, const: RECORDED, description: Durable receipt also fences standalone writes to this local slot; no online bundle activation}
        directive: {$ref: '#/components/schemas/ReleaseBundleActivationDirective'}
        latestSequence: {type: integer, format: int64, minimum: 1}
        current: {type: boolean, description: Whether this receipt is the highest recorded sequence; does not describe online routing}
        recordedAt: {type: string, format: date-time}
    JourneyBundleExecutionProbe:
      $ref: '../schema/events/journey-bundle-execution-probe.schema.json'
    JourneyBundleExecutionAck:
      $ref: '../schema/events/journey-bundle-execution-ack.schema.json'
    JourneyExecutionProbeReceipt:
      type: object
      additionalProperties: false
      required: [state, probe, acknowledgements, observedAt]
      properties:
        state: {type: string, enum: [PENDING, READY, EXPIRED]}
        probe: {$ref: '#/components/schemas/JourneyBundleExecutionProbe'}
        acknowledgements: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/JourneyBundleExecutionAck'}, description: Ordered unique actual subtask indices; duplicate messages and later attempts never increase coverage}
        observedAt: {type: string, format: date-time}
    ReleaseBundleAdmissionRequest:
      type: object
      additionalProperties: false
      required: [campaignId, participationId, subjectToken]
      properties:
        campaignId: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$'}
        participationId: {type: string, minLength: 1, maxLength: 128, description: Stable identifier from the trusted business caller; no control characters or invalid Unicode. Not a client-selected release version.}
        subjectToken: {type: string, minLength: 1, maxLength: 512, description: Canonical subject from the trusted identity/member adapter; never inferred from raw OIDC sub by this endpoint.}
    ReleaseBundleParticipation:
      type: object
      additionalProperties: false
      description: Durable participation-to-bundle fact, not access authorization or permission to repeat side effects. No issuance endpoint yet. Consumers must compare trusted context, exact Control directive, current trust and live business guards; historical expiry is checked at admittedAt.
      required: [bindingId, tenantId, campaignId, environment, cell, participationId, subjectHash, directiveId, activationSequence, activationSignature, bundleId, bundleVersion, contentHash, admittedAt, signatureKeyId, signature]
      properties:
        bindingId: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$'}
        tenantId: {$ref: '#/components/schemas/TenantId'}
        campaignId: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$'}
        environment: {type: string, minLength: 1, maxLength: 32}
        cell: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$'}
        participationId: {type: string, minLength: 1, maxLength: 128, description: Trusted opaque business participation ID; exact case and whitespace preserved; blank/control/invalid Unicode forbidden}
        subjectHash: {type: string, pattern: '^[a-f0-9]{64}$', description: Purpose and tenant bound canonical SHA256 of the trusted subject token; not anonymization}
        directiveId: {type: string, pattern: '^[A-Za-z0-9_.:@-]{1,64}$'}
        activationSequence: {type: integer, format: int64, minimum: 1}
        activationSignature: {type: string, pattern: '^[A-Za-z0-9_-]{85}[AQgw]$', description: Exact Control directive signature; canonical 64-byte Ed25519 Base64URL without padding}
        bundleId: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$'}
        bundleVersion: {type: integer, format: int64, minimum: 1}
        contentHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        admittedAt: {type: string, format: date-time, description: Persisted admission time at or after authorization and strictly before bundle expiry; no more than 60 seconds in the future}
        signatureKeyId: {type: string, pattern: '^[A-Za-z0-9_.:@-]{1,64}$'}
        signature: {type: string, pattern: '^[A-Za-z0-9_-]{85}[AQgw]$', description: Independent participation-purpose signature by the admission authority; every preceding field is covered}
    ReleaseBundleActivationDirective:
      type: object
      additionalProperties: false
      description: Signed whole-bundle authorization. This shared contract has no issuance or online apply endpoint yet and is not proof of runtime application. Future receivers must persist sequence arbitration and exact participation bindings.
      required: [directiveId, bundle, activationSequence, action, organizationId, shopId, authorizedAt, authorizedBy, signatureKeyId, signature]
      properties:
        directiveId: {type: string, pattern: '^[A-Za-z0-9_.:@-]{1,64}$'}
        bundle: {$ref: '#/components/schemas/ReleaseBundleManifest'}
        activationSequence: {type: integer, format: int64, minimum: 1, description: Monotonic per tenant/campaign/environment/cell including rollback}
        action: {type: string, enum: [ACTIVATE, ROLLBACK]}
        organizationId: {type: string, minLength: 1, maxLength: 64, description: Exact campaign organization from Control; wildcard forbidden}
        shopId: {type: string, maxLength: 64, description: Exact campaign shop or empty for organization scope; wildcard forbidden}
        authorizedAt: {type: string, format: date-time, description: At or after bundle creation and every member activationAt, strictly before bundle expiry}
        authorizedBy: {type: string, minLength: 1, maxLength: 128}
        signatureKeyId: {type: string, pattern: '^[A-Za-z0-9_.:@-]{1,64}$'}
        signature: {type: string, minLength: 1, description: Independent activation purpose signature covers full nested bundle content and signature}
    TenantId:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
    ReleaseBundleManifest:
      type: object
      additionalProperties: false
      required: [bundleId, tenantId, campaignId, version, environment, cell, contentHash, members, createdAt, expiresAt, signatureKeyId, signature]
      properties:
        bundleId: {type: string, maxLength: 64}
        tenantId: {$ref: '#/components/schemas/TenantId'}
        campaignId: {type: string, maxLength: 64}
        version: {type: integer, format: int64, minimum: 1}
        environment: {type: string, maxLength: 32}
        cell: {type: string, maxLength: 64}
        contentHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        members:
          type: array
          minItems: 2
          maxItems: 8
          items: {type: object, description: Full existing signed ReleaseManifest; every member field is included in the outer signature}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, description: Earliest expiry among all members}
        signatureKeyId: {type: string, maxLength: 64}
        signature: {type: string, minLength: 1}
    ReleaseBundleView:
      type: object
      additionalProperties: false
      required: [bundleId, campaignId, version, environment, cell, state, contentHash, members, createdBy, createdAt]
      properties:
        bundleId: {type: string}
        campaignId: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        environment: {type: string}
        cell: {type: string}
        state: {type: string, enum: [PREPARING]}
        contentHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        members:
          type: array
          minItems: 2
          maxItems: 8
          items: {type: object, description: Existing signed ReleaseManifest frozen at preparation time}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
    ClientErrorEvent:
      type: object
      additionalProperties: false
      required: [schemaVersion, source, route, httpStatus]
      properties:
        schemaVersion: {type: integer, const: 1}
        source: {type: string, enum: [API, WINDOW, PROMISE, REACT, UNKNOWN]}
        route: {type: string, enum: [HOME, CAMPAIGNS, DESIGNERS, ASSETS, RELEASES, GOVERNANCE, ANALYTICS, REFERRALS, AUTH, OPERATIONS, API, OTHER]}
        httpStatus:
          oneOf: [{type: integer, const: 0}, {type: integer, minimum: 100, maximum: 599}]
        backendTraceId: {type: string, pattern: '^[0-9a-fA-F]{32}$', description: Optional backend trace reference; omit unknown or non-trace correlation IDs}
    ReleasePage:
      type: object
      required: [items, nextCursor, hasMore, state]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ReleaseView'}}
        nextCursor: {type: [string, 'null'], description: Last returned manifestId only when hasMore is true}
        hasMore: {type: boolean}
        state: {type: [string, 'null'], enum: [STAGED, ACTIVE, ROLLED_BACK, REVOKED, null], description: Echo of requested state; null means all states}
    ReleaseView:
      type: object
      required: [manifest, state, readyReplicas, readyCapacity, activationDirective]
      properties:
        manifest:
          type: object
          description: Existing signed single-definition release manifest; unchanged by pagination.
          required: [manifestId, environment, cell, runtime, namespace, generation, artifacts, createdAt]
          properties:
            manifestId: {type: string}
            environment: {type: string}
            cell: {type: string}
            runtime: {type: string}
            namespace: {type: string}
            generation: {type: integer, format: int64}
            artifacts: {type: array, items: {$ref: '#/components/schemas/ArtifactReference'}}
            createdAt: {type: string, format: date-time}
        state: {type: string, enum: [STAGED, ACTIVE, ROLLED_BACK, REVOKED]}
        readyReplicas: {type: integer, minimum: 0}
        readyCapacity: {type: integer, format: int64, minimum: 0}
        activationDirective: {type: [object, 'null']}
    AudiencePage:
      type: object
      required: [items, hasMore, nextCursor, query]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [segmentId, version, name, status, rule, ruleHash, createdAt]
            properties:
              segmentId: {type: string}
              version: {type: integer, format: int64, minimum: 1}
              name: {type: string}
              status: {type: string}
              rule: {type: object, additionalProperties: true}
              ruleHash: {type: string}
              createdAt: {type: string, format: date-time}
        hasMore: {type: boolean}
        nextCursor: {type: [string, 'null'], description: Final returned segment ID only when another page exists}
        query: {type: string, maxLength: 128, description: Trimmed search query}
    BenefitPage:
      type: object
      required: [items, hasMore, nextCursor, query]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [benefitId, version, name, status, resourceKey, benefitSkuId, policy, createdBy, createdAt]
            properties:
              benefitId: {type: string}
              version: {type: integer, format: int64, minimum: 1}
              name: {type: string}
              status: {type: string}
              policy: {type: object, additionalProperties: true}
              resourceKey: {type: string}
              createdBy: {type: string}
              benefitSkuId: {type: [string, 'null']}
              createdAt: {type: string, format: date-time}
        hasMore: {type: boolean}
        nextCursor: {type: [string, 'null'], description: Final returned benefit ID only when another page exists}
        query: {type: string, maxLength: 128, description: Trimmed search query}
    TemplatePage:
      type: object
      required: [items, hasMore, nextCursor, query]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [templateId, version, channel, content, requiredVariables, state, createdAt]
            properties:
              templateId: {type: string}
              version: {type: integer, format: int64, minimum: 1}
              channel: {type: string}
              content: {type: string}
              requiredVariables: {type: array, items: {type: string}, description: Ordered as persisted}
              state: {type: string}
              createdAt: {type: string, format: date-time}
        hasMore: {type: boolean}
        nextCursor: {type: [string, 'null'], description: Final returned template ID only when another page exists}
        query: {type: string, maxLength: 128, description: Trimmed search query}
    ApprovalPage:
      type: object
      required: [items, nextCursor, hasMore, status]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ApprovalView'}}
        nextCursor: {type: [string, 'null'], description: Last returned caseId only when hasMore is true}
        hasMore: {type: boolean}
        status: {type: [string, 'null'], enum: [OPEN, APPROVED, REJECTED, null], description: Echo of the requested status; null means all statuses}
    ApprovalView:
      type: object
      required: [caseId, definitionId, definitionVersion, submittedBy, requiredRoles, approvals, status, updatedAt]
      properties:
        caseId: {type: string}
        definitionId: {type: string}
        definitionVersion: {type: integer, format: int64}
        submittedBy: {type: string}
        requiredRoles: {type: array, items: {type: string, enum: [BUSINESS, FINANCE, COMPLIANCE, MERCHANT]}}
        approvals: {type: object, additionalProperties: {type: string}}
        status: {type: string, enum: [OPEN, APPROVED, REJECTED]}
        updatedAt: {type: string, format: date-time}
    TemplateCreate:
      type: object
      required: [templateId, version, channel, content, requiredVariables]
      properties:
        templateId: {type: string, minLength: 1, maxLength: 128, description: No whitespace or control characters}
        version: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        channel: {type: string, minLength: 1, maxLength: 32, description: Configured channel identifier without whitespace or control characters}
        content: {type: string, minLength: 1, maxLength: 8000, description: Nonblank message body, stored verbatim}
        requiredVariables:
          type: array
          maxItems: 32
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 60, pattern: '^[A-Za-z_][A-Za-z0-9_.-]{0,59}$'}
    JsonObject: {type: object, additionalProperties: true}
    BenefitStatus: {type: string, enum: [DRAFT, ACTIVE, RETIRED]}
    BenefitSkuStatus: {type: string, enum: [DRAFT, PENDING_APPROVAL, ACTIVE, PAUSED, RETIRED]}
    CreateFundingAccountRequest:
      type: object
      additionalProperties: false
      required: [resourceKey, type, currency, authorized, fencingEpoch]
      properties:
        resourceKey: {type: string, minLength: 1}
        type: {type: string, enum: [INVENTORY, BUDGET]}
        currency: {type: string, minLength: 1}
        authorized: {type: integer, format: int64, minimum: 0}
        fencingEpoch: {type: integer, format: int64, minimum: 1}
    BenefitRequest:
      type: object
      additionalProperties: false
      required: [name, status, resourceKey, policy]
      properties:
        name: {type: string, minLength: 1, maxLength: 256}
        status: {$ref: '#/components/schemas/BenefitStatus'}
        resourceKey: {type: string, maxLength: 256}
        benefitSkuId: {type: [string, 'null'], maxLength: 128}
        policy:
          type: object
          required: [type]
          properties: {type: {type: string, enum: [CASH, COUPON, SERVICE_VOUCHER, REDEMPTION_CODE, PHYSICAL]}}
          additionalProperties: true
    BenefitView:
      type: object
      additionalProperties: false
      required: [benefitId, version, name, status, resourceKey, benefitSkuId, policy, createdBy, createdAt]
      properties:
        benefitId: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        status: {$ref: '#/components/schemas/BenefitStatus'}
        resourceKey: {type: string}
        benefitSkuId: {type: [string, 'null']}
        policy: {type: object, additionalProperties: true}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
    BenefitSkuView:
      type: object
      additionalProperties: false
      required: [skuId, benefitType, status, enabled, validityType, usableWeekdays, version]
      properties:
        skuId: {type: string}
        benefitType: {type: string, enum: [CASH, COUPON, SERVICE_VOUCHER, REDEMPTION_CODE, PHYSICAL]}
        faceValueMinor: {type: [integer, 'null'], format: int64}
        currency: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/BenefitSkuStatus'}
        enabled: {type: boolean}
        validityType: {type: string, enum: [ABSOLUTE, RELATIVE]}
        validFrom: {type: [string, 'null'], format: date-time}
        validTo: {type: [string, 'null'], format: date-time}
        relativeDays: {type: [integer, 'null']}
        usableWeekdays: {type: array, items: {type: integer, minimum: 1, maximum: 7}}
        dailyQuota: {type: [integer, 'null'], format: int64}
        userLimitPerDay: {type: [integer, 'null'], format: int64}
        userLimitTotal: {type: [integer, 'null'], format: int64}
        equivalentSkuId: {type: [string, 'null']}
        version: {type: integer, format: int64, minimum: 1}
    AssembleAwardIntentRequest:
      type: object
      additionalProperties: false
      required: [sourceRequestId, campaignId, definitionVersion, subjectRef, offerToken, cartDigest]
      properties:
        sourceRequestId: {type: string, minLength: 1, maxLength: 128}
        campaignId: {type: string, minLength: 1, maxLength: 64}
        definitionVersion: {type: integer, format: int64, minimum: 1, maximum: 2147483647}
        subjectRef: {type: string, minLength: 1, maxLength: 256}
        offerToken: {type: string, minLength: 1, maxLength: 32768}
        cartDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
    AwardFulfillmentView:
      type: object
      additionalProperties: false
      required: [intentId, synchronizationState, benefitOrderNo, centerStatus, checkedAt, errorCode, consecutiveFailures, refreshEnabled, items]
      properties:
        intentId: {type: string}
        synchronizationState: {type: string, enum: [UNOBSERVED, PENDING, RUNNING, PAUSED]}
        benefitOrderNo: {type: [string, 'null']}
        centerStatus: {type: [string, 'null'], enum: [ACCEPTED, PROCESSING, SUCCEEDED, PARTIAL_SUCCEEDED, FAILED, REMEDIATING, REVERSING, REVERSED, PARTIALLY_REVERSED, null]}
        checkedAt: {type: [string, 'null'], format: date-time, description: "Successful lookup completion time, not the time of award delivery"}
        errorCode: {type: string, description: Sanitized lookup failure; never interpreted as award failure or cancellation}
        consecutiveFailures: {type: integer, minimum: 0}
        refreshEnabled: {type: boolean}
        items:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [clientItemId, skuId, status, quantity, skuVersion]
            properties:
              clientItemId: {type: string}
              skuId: {type: string}
              status: {type: string, enum: [PENDING, RESERVED, DISPATCHING, SUCCEEDED, FAILED_FINAL, UNKNOWN, QUERYING, REISSUING, REVERSING, REVERSED, REVERSAL_FAILED, REVERSAL_UNKNOWN]}
              quantity: {type: integer, format: int64, minimum: 1}
              skuVersion: {type: [integer, 'null'], format: int64, minimum: 0}
    AwardIntentView:
      type: object
      additionalProperties: false
      required: [intentId, sourceSystem, sourceRequestId, campaignId, definitionVersion, subjectHash,
                 deliveryMode, status, deliveryResult, attempts, lastError, createdAt, updatedAt]
      properties:
        intentId: {type: string}
        sourceSystem: {type: string}
        sourceRequestId: {type: string}
        campaignId: {type: string}
        definitionVersion: {type: integer, format: int64, minimum: 1}
        subjectHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        deliveryMode: {type: string, enum: [LEGACY, SHADOW, CENTER]}
        status: {type: string, enum: [PENDING, SENT, DEAD, RISK_BLOCKED]}
        deliveryResult: {type: [string, 'null'], enum: [LEGACY_OWNED, SHADOW_RECORDED, CENTER_ENQUEUED, CENTER_ACCEPTED, null]}
        riskAction: {type: string, enum: [CHALLENGE, REVIEW, REJECT, UNAVAILABLE]}
        riskReason: {type: string}
        riskDecisionId: {type: [string, 'null']}
        attempts: {type: integer, minimum: 0}
        benefitOrderNo: {type: [string, 'null']}
        lastError: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        sentAt: {type: [string, 'null'], format: date-time}
    CreateCampaign:
      type: object
      additionalProperties: false
      required: [name, objective, organizationId]
      properties: {name: {type: string, minLength: 1}, objective: {type: string, minLength: 1}, organizationId: {type: string, minLength: 1}, shopId: {type: [string, 'null']}, campaignType: {type: [string, 'null'], enum: [STANDARD, REFERRAL, null], default: STANDARD}}
    SaveDefinition:
      type: object
      additionalProperties: false
      required: [campaignId, graph]
      properties: {campaignId: {type: string, minLength: 1}, graph: {$ref: '../schema/graph/graph-definition.schema.json'}}
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: {type: string, enum: [BUSINESS, FINANCE, COMPLIANCE, MERCHANT]}
        decision: {type: string, enum: [APPROVE, REJECT], default: APPROVE}
        comment: {type: string, maxLength: 128}
    StageReleaseRequest:
      type: object
      additionalProperties: false
      required: [definitionId, definitionVersion, environment, cell, runtime, namespace, artifacts, schemaVersions, canaryBasisPoints, activationAt, approvalCaseIds]
      properties:
        definitionId: {type: string}
        definitionVersion: {type: integer, format: int64, minimum: 1}
        environment: {type: string}
        cell: {type: string}
        runtime: {type: string}
        namespace: {type: string}
        artifacts: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ArtifactReference'}}
        schemaVersions: {type: object, additionalProperties: {type: string}}
        canaryBasisPoints: {type: integer, minimum: 0, maximum: 10000}
        activationAt: {type: string, format: date-time}
        approvalCaseIds: {type: array, items: {type: string}}
    RollbackCandidate:
      type: object
      required: [manifestId, generation, expiresAt, artifacts]
      properties:
        manifestId: {type: string}
        generation: {type: integer, format: int64, minimum: 1}
        expiresAt: {type: string, format: date-time}
        artifacts: {type: array, items: {$ref: '#/components/schemas/ArtifactReference'}}
    DmnDraftTable:
      type: object
      additionalProperties: false
      required: [hitPolicy, inputs, outputs, rules]
      description: Bounded draft only; names and cells may be empty or semantically invalid. Analysis is a separate operation.
      properties:
        hitPolicy: {type: string, enum: [UNIQUE, FIRST]}
        inputs: &dmnDraftColumns
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [name, type]
            properties:
              name: {type: string, maxLength: 32}
              type: {type: string, enum: [number, string, boolean]}
        outputs: *dmnDraftColumns
        rules:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [inputs, outputs]
            properties:
              inputs: {type: array, minItems: 1, maxItems: 4, items: {type: string, maxLength: 256}}
              outputs: {type: array, minItems: 1, maxItems: 4, items: {type: string, maxLength: 256}}
    DmnDraftSaveRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, table]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775806}
        table: {$ref: '#/components/schemas/DmnDraftTable'}
    DmnDraftView:
      type: object
      required: [campaignId, version, contentHash, createdBy, createdAt, table]
      properties:
        campaignId: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        contentHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        table: {$ref: '#/components/schemas/DmnDraftTable'}
    DmnColumn:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,31}$'}
        type: {type: string, enum: [number, string, boolean]}
    DmnRule:
      type: object
      additionalProperties: false
      required: [inputs, outputs]
      properties:
        inputs: {type: array, minItems: 1, maxItems: 4, items: {type: string, minLength: 1, maxLength: 256}}
        outputs: {type: array, minItems: 1, maxItems: 4, items: {type: string, minLength: 1, maxLength: 256}}
    DmnTable:
      type: object
      additionalProperties: false
      required: [hitPolicy, inputs, outputs, rules]
      description: Column names are unique across inputs and outputs. Each rule has exactly one cell per column. Inputs accept dash wildcard, numeric comparisons (< <= > >= =), or scalar equality. Outputs accept only decimal, JSON quoted string, or true/false literals; no functions or arbitrary expressions.
      properties:
        hitPolicy: {type: string, enum: [UNIQUE, FIRST]}
        inputs: {type: array, minItems: 1, maxItems: 4, items: {$ref: '#/components/schemas/DmnColumn'}}
        outputs: {type: array, minItems: 1, maxItems: 4, items: {$ref: '#/components/schemas/DmnColumn'}}
        rules: {type: array, minItems: 1, maxItems: 32, items: {$ref: '#/components/schemas/DmnRule'}}
    DmnAnalyzeRequest:
      type: object
      additionalProperties: false
      required: [table]
      properties:
        table: {$ref: '#/components/schemas/DmnTable'}
    DmnEvaluateRequest:
      type: object
      additionalProperties: false
      required: [table, context]
      properties:
        table: {$ref: '#/components/schemas/DmnTable'}
        context: {type: object, minProperties: 1, maxProperties: 4, additionalProperties: {type: string, maxLength: 256}}
    DmnAnalysis:
      type: object
      required: [valid, gaps, overlaps, messages]
      properties:
        valid: {type: boolean}
        gaps: {type: array, items: {type: string}}
        overlaps: {type: array, items: {type: string}}
        messages: {type: array, items: {type: string}}
    DmnEvaluation:
      type: object
      required: [success, results, messages]
      properties:
        success: {type: boolean}
        results: {type: object, additionalProperties: true, description: Engine context; decimal numbers are encoded as exact decimal strings to avoid client precision loss.}
        messages: {type: array, items: {type: string}}
    CompileRequest:
      type: object
      additionalProperties: false
      required: [definitionId, definitionVersion, format, namespace, modelName]
      properties:
        definitionId: {type: string, minLength: 1}
        definitionVersion: {type: integer, format: int64, minimum: 1}
        format: {type: string, enum: [GRAPH, DRL, DMN, OFFER_POLICY, JOURNEY_PLAN]}
        namespace: {type: string, minLength: 1}
        modelName: {type: string, minLength: 1}
        source: {type: [string, 'null'], maxLength: 1048576}
        graph: {$ref: '../schema/graph/graph-definition.schema.json'}
    CompileReport:
      type: object
      additionalProperties: false
      required: [valid, artifactId, checksum, signatureKeyId, signature, abi, messages]
      properties:
        valid: {type: boolean}
        artifactId: {type: [string, 'null']}
        checksum: {type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$'}
        signatureKeyId: {type: [string, 'null']}
        signature: {type: [string, 'null']}
        abi: {type: [string, 'null']}
        messages: {type: array, items: {type: string}}
    ArtifactReference:
      type: object
      additionalProperties: false
      required: [artifactId, type, uri, checksum, sourceDigest, signatureKeyId, signature, abi, definitionId, definitionVersion]
      properties:
        artifactId: {type: string, minLength: 1}
        type: {type: string, minLength: 1}
        uri: {type: string, minLength: 1}
        checksum: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        sourceDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        signatureKeyId: {type: string, minLength: 1}
        signature: {type: string, minLength: 1}
        abi: {type: string, minLength: 1}
        definitionId: {type: string, minLength: 1}
        definitionVersion: {type: integer, format: int64, minimum: 1}
    ArtifactView:
      allOf:
        - {$ref: '#/components/schemas/ArtifactReference'}
        - type: object
          required: [payload, compiledAt]
          properties:
            payload: {type: string, contentEncoding: base64}
            compiledAt: {type: string, format: date-time}
    RuntimeAck:
      type: object
      additionalProperties: false
      required: [manifestId, generation, runtimeId, cell, status, buildDigest, supportedAbis, warmedArtifactIds, capacity, acknowledgedAt, signatureKeyId, signature]
      properties:
        manifestId: {type: string, minLength: 1}
        generation: {type: integer, format: int64, minimum: 1}
        runtimeId: {type: string, minLength: 1}
        cell: {type: string, minLength: 1}
        status: {type: string, enum: [DOWNLOADING, VERIFIED, WARMING, READY, REJECTED]}
        buildDigest: {type: string, minLength: 1}
        supportedAbis: {type: array, uniqueItems: true, items: {type: string}}
        warmedArtifactIds: {type: array, uniqueItems: true, items: {type: string}}
        capacity: {type: integer, format: int64, minimum: 0}
        acknowledgedAt: {type: string, format: date-time}
        signatureKeyId: {type: string, minLength: 1}
        signature: {type: string}
    BenefitReleaseEligibilityRequest:
      type: object
      additionalProperties: false
      required: [references]
      properties: {references: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: '^.+@[1-9][0-9]*$'}}}
    BenefitReleaseEligibility:
      type: object
      additionalProperties: false
      required: [releasable, references]
      properties:
        releasable: {type: boolean, const: true}
        references: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
    AutomaticDecisionTrace:
      type: object
      additionalProperties: false
      required: [traceId, requestId, orderId, maskedSubject, generation, durationMicros, candidates, pricing, termsVersion, expiresAt, legalHold, createdAt, events]
      properties:
        traceId: {type: string, description: Original quoteId}
        requestId: {type: string}
        orderId: {type: string}
        maskedSubject: {type: string, description: Tenant-scoped hash prefix; no original subject}
        generation: {type: integer, format: int64}
        durationMicros: {type: integer, format: int64, minimum: 0}
        candidates: {type: object, description: Bounded outcomes with total count and explicit truncation flag}
        pricing: {type: object, description: Currency and aggregate minor-unit amounts; no cart lines or offerToken}
        termsVersion: {type: string, const: '', description: Not available in this decision summary}
        expiresAt: {type: string, format: date-time}
        legalHold: {type: boolean, const: false}
        createdAt: {type: string, format: date-time, description: Original decidedAt; never rewritten during replay}
        events:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [at, type, title, detail]
            properties:
              at: {type: string, format: date-time}
              type: {type: string, const: DECISION_EVALUATED}
              title: {type: string}
              detail: {type: string}
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [requestId, idempotencyKey, organizationId, subjectToken, channel, occurredAt, cart]
      properties:
        requestId: {type: string}
        idempotencyKey: {type: string}
        organizationId: {type: string}
        orderId: {type: string}
        subjectToken: {type: string}
        channel: {type: string}
        occurredAt: {type: string, format: date-time}
        cart: {$ref: '#/components/schemas/Cart'}
        audienceSnapshotIds: {type: array, uniqueItems: true, items: {type: string}}
        bundleContext: {$ref: '#/components/schemas/BundleDecisionContext'}
    UnboundDecisionRequest:
      allOf:
        - {$ref: '#/components/schemas/DecisionRequest'}
        - not: {required: [bundleContext]}
    BundleDecisionRequest:
      allOf:
        - {$ref: '#/components/schemas/DecisionRequest'}
        - required: [bundleContext]
    BundleDecisionContext:
      type: object
      additionalProperties: false
      description: 可信业务入口传入的既有参与；必须匹配凭证、主体及当前组织店铺范围。只固定精确组合版本，不代表新准入或延长优惠有效期。完整上下文进入幂等摘要，成功重放仍检查当前停用和信任。缺省保持原路由与JSON摘要，默认未配参与信任时拒绝新路径。
      required: [campaignId, participationId, participation]
      properties:
        campaignId: {type: string, maxLength: 64}
        participationId: {type: string, maxLength: 128}
        participation: {$ref: '#/components/schemas/ReleaseBundleParticipation'}
    Cart:
      type: object
      additionalProperties: false
      required: [currency, lines]
      properties: {currency: {type: string, pattern: '^[A-Z]{3}$'}, lines: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/CartLine'}}}
    CartLine:
      type: object
      additionalProperties: false
      required: [lineId, skuId, shopId, quantity, unitPrice, floorUnitPrice, shippingLine]
      properties:
        lineId: {type: string}
        skuId: {type: string}
        shopId: {type: string}
        categoryId: {type: string}
        brandId: {type: string}
        quantity: {type: integer, minimum: 1, maximum: 100000}
        unitPrice: {$ref: '#/components/schemas/Money'}
        floorUnitPrice: {$ref: '#/components/schemas/Money'}
        shippingLine: {type: boolean}
    Money:
      type: object
      additionalProperties: false
      required: [currency, minorUnits]
      properties: {currency: {type: string, pattern: '^[A-Z]{3}$'}, minorUnits: {type: integer, format: int64, minimum: 0}}
    ReservePromotionRequest:
      type: object
      additionalProperties: false
      required: [offerToken, cartDigest, expectedFencingEpochs]
      properties: {offerToken: {type: string}, cartDigest: {type: string}, orderId: {type: string}, expectedFencingEpochs: {type: object, additionalProperties: {type: integer, format: int64, minimum: 1}}}
    InboundEvent:
      type: object
      additionalProperties: false
      required: [eventId, sourceId, eventType, businessKey, subjectToken, occurredAt, schemaVersion, data]
      properties:
        eventId: {type: string}
        sourceId: {type: string}
        eventType: {type: string}
        businessKey: {type: string}
        subjectToken: {type: string}
        occurredAt: {type: string, format: date-time}
        schemaVersion: {type: string}
        aggregateVersion: {type: [integer, 'null'], format: int64}
        data: {type: object, additionalProperties: true}
    MeasurementFactRequest:
      type: object
      additionalProperties: false
      required: [eventId, type, businessKey, subjectToken, occurredAt, ingestedAt, schemaVersion, attributes, correctionOf]
      properties:
        eventId: {type: string}
        type: {type: string}
        businessKey: {type: string}
        subjectToken: {type: string}
        occurredAt: {type: string, format: date-time}
        ingestedAt: {type: string, format: date-time}
        schemaVersion: {type: string}
        attributes: {type: object, additionalProperties: {type: string}}
        correctionOf: {type: string}
    JourneySimulationFields:
      type: object
      maxProperties: 32
      propertyNames: {type: string, minLength: 1, maxLength: 64, pattern: '.*\S.*'}
      additionalProperties: {type: string, maxLength: 256}
    JourneySimulationRequest:
      type: object
      additionalProperties: false
      required: [initialVariables, events, horizonSeconds]
      properties:
        initialVariables: {$ref: '#/components/schemas/JourneySimulationFields'}
        horizonSeconds: {type: integer, minimum: 0, maximum: 604800}
        events:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [offsetSeconds, eventType, attributes]
            properties:
              offsetSeconds: {type: integer, minimum: 0, maximum: 604800}
              eventType: {type: string, minLength: 1, maxLength: 64, pattern: '.*\S.*'}
              attributes: {$ref: '#/components/schemas/JourneySimulationFields'}
    JourneySimulationResult:
      type: object
      additionalProperties: false
      required: [kind, definitionId, version, stopReason, status, currentNodeId, elapsedSeconds, remainingEvents, steps, pendingTimers, failureCode]
      properties:
        kind: {type: string, const: JOURNEY_SIMULATION}
        definitionId: {type: string}
        version: {type: integer, minimum: 1}
        stopReason: {type: string, enum: [COMPLETED, WAITING, FAILED, TRUNCATED]}
        status: {type: string, enum: [RUNNING, WAITING, COMPLETED, FAILED]}
        currentNodeId: {type: string}
        elapsedSeconds: {type: number, minimum: 0}
        remainingEvents: {type: integer, minimum: 0, maximum: 32}
        failureCode: {type: string}
        pendingTimers:
          type: array
          maxItems: 1
          items:
            type: object
            required: [nodeId, dueOffsetSeconds]
            properties:
              nodeId: {type: string}
              dueOffsetSeconds: {type: number, minimum: 0}
        steps:
          type: array
          maxItems: 64
          items:
            type: object
            required: [sequence, signal, eventType, offsetSeconds, fromNodeId, toNodeId, status, commands]
            properties:
              sequence: {type: integer, minimum: 1, maximum: 64}
              signal: {type: string, enum: [START, EVENT, TIMER]}
              eventType: {type: string}
              offsetSeconds: {type: number, minimum: 0}
              fromNodeId: {type: string}
              toNodeId: {type: string}
              status: {type: string, enum: [RUNNING, WAITING, COMPLETED, FAILED]}
              commands:
                type: array
                maxItems: 1000
                items:
                  type: object
                  required: [type, nodeId, commandId]
                  properties:
                    type: {type: string, enum: [SEND, GRANT, WEBHOOK]}
                    nodeId: {type: string}
                    commandId: {type: string, description: Deterministic preview-only identity; never dispatched.}
    Problem:
      type: object
      required: [type, title, status, code, traceId, retryable]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code: {type: string}
        traceId: {type: string}
        retryable: {type: boolean}
        violations: {type: array, items: {$ref: '#/components/schemas/JsonObject'}}

    MeasurementDashboard:
      type: object
      required: [campaignId, counts, attributedRevenueMinor, fundingCostMinor, roi, completeThrough, lag]
      properties:
        campaignId: {type: string, description: Applied campaign filter; empty means all campaigns}
        counts: {type: object, additionalProperties: {type: integer, format: int64}}
        attributedRevenueMinor: {type: integer, format: int64}
        fundingCostMinor: {type: integer, format: int64}
        roi: {type: number}
        completeThrough: {type: string, format: date-time}
        lag: {type: object, properties: {seconds: {type: integer, format: int64}}}
    MeasurementSeries:
      type: object
      required: [campaignId, points]
      properties:
        campaignId: {type: string, description: Applied campaign filter; empty means all campaigns}
        points:
          type: array
          items:
            type: object
            required: [at, revenueMinor, costMinor, conversions]
            properties:
              at: {type: string, format: date-time}
              revenueMinor: {type: integer, format: int64}
              costMinor: {type: integer, format: int64}
              conversions: {type: integer, format: int64}
