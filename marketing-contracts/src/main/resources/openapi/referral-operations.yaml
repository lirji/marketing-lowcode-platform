  "paths": {
    "/api/v1/referral-campaigns/{campaignId}/participants": {
      "get": {
        "tags": [
          "Referral"
        ],
        "operationId": "referralParticipants",
        "description": "Requires referral:read. Tenant, organization and shop scopes are derived from the verified identity. Database projections do not imply external event completeness.",
        "parameters": [
          {
            "name": "campaignId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9._:-]{1,64}$"
            }
          },
          {
            "name": "after",
            "in": "query",
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9._:-]{1,64}$"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Current database projection, with no subject plaintext or tokens.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ParticipantPage"
                }
              }
            }
          },
          "default": {
            "description": "Authentication, authorization or validation problem."
          }
        },
        "x-required-permission": "referral:read"
      }
    },
