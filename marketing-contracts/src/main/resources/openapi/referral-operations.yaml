    "/api/v1/referral-rewards/{rewardId}:reevaluate": {
      "post": {
        "tags": [
          "Referral"
        ],
        "operationId": "reevaluateReferralReward",
        "x-required-permission": "referral:reevaluate",
        "description": "Permanently queues qualification reevaluation. The original receipt is replayed; 202 does not mean issued, qualified or evaluated.",
        "parameters": [
          {
            "name": "rewardId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9._:-]{8,128}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "reason"
                ],
                "properties": {
                  "reason": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 128
                  }
                }
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Durable queue receipt; not completion or award delivery.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReevaluationReceipt"
                }
              }
            }
          },
          "default": {
            "description": "Authentication, authorization, conflict or validation problem."
          }
        }
      }
    }
  },
