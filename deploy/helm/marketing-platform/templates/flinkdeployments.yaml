{{- if .Values.flink.enabled }}
{{- range $name, $jar := .Values.flink.jobs }}
---
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: marketing-{{ $name }}
  labels:
    {{- include "marketing.labels" $ | nindent 4 }}
    app.kubernetes.io/name: marketing-{{ $name }}-flink
spec:
  image: {{ printf "%s/%s:%s" $.Values.global.imageRegistry $.Values.flink.image $.Values.global.imageTag | quote }}
  flinkVersion: v2_2
  serviceAccount: {{ $.Values.flink.serviceAccount }}
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: {{ $.Values.flink.taskSlots | quote }}
    state.checkpoints.dir: {{ printf "%s/%s" (trimSuffix "/" $.Values.flink.checkpointStorage) $name | quote }}
    state.savepoints.dir: {{ printf "%s/%s" (trimSuffix "/" $.Values.flink.savepointStorage) $name | quote }}
    high-availability.type: kubernetes
    high-availability.storageDir: {{ printf "%s/%s" (trimSuffix "/" $.Values.flink.highAvailabilityStorage) $name | quote }}
    execution.checkpointing.interval: {{ $.Values.flink.checkpointInterval | quote }}
    execution.checkpointing.mode: EXACTLY_ONCE
    restart-strategy.type: exponential-delay
    s3.endpoint: {{ $.Values.external.s3.endpoint | quote }}
    s3.region: {{ $.Values.external.s3.region | quote }}
  podTemplate:
    metadata:
      labels: {app.kubernetes.io/part-of: marketing-platform}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 9999, runAsGroup: 9999, fsGroup: 9999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: flink-main-container
          env:
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: {{ $.Values.external.kafka.bootstrapServers | quote }}}
            - {name: KAFKA_SECURITY_PROTOCOL, value: {{ $.Values.external.kafka.securityProtocol | quote }}}
            - {name: KAFKA_SASL_MECHANISM, value: {{ $.Values.external.kafka.saslMechanism | quote }}}
            - name: KAFKA_SASL_JAAS_CONFIG
              valueFrom: {secretKeyRef: {name: {{ $.Values.global.externalSecretName }}, key: kafka-sasl-jaas-config}}
            - {name: DEPLOYMENT_ID, value: {{ printf "%s-%s" $.Release.Name $name | quote }}}
            - {name: FLINK_PARALLELISM, value: {{ $.Values.flink.parallelism | quote }}}
            {{- if eq $name "journey" }}
            - name: JOURNEY_RELEASE_TRUSTED_KEY_ID
              valueFrom: {secretKeyRef: {name: {{ $.Values.global.externalSecretName }}, key: release-signing-key-id}}
            - name: JOURNEY_RELEASE_PUBLIC_KEY_BASE64
              valueFrom: {secretKeyRef: {name: {{ $.Values.global.externalSecretName }}, key: release-signing-public-key-base64}}
            - name: JOURNEY_RELEASE_TRUSTED_PUBLIC_KEYS
              valueFrom: {secretKeyRef: {name: {{ $.Values.global.externalSecretName }}, key: release-trusted-public-keys, optional: true}}
            - name: JOURNEY_COMPILER_TRUSTED_KEY_ID
              valueFrom: {secretKeyRef: {name: {{ $.Values.global.externalSecretName }}, key: compiler-signing-key-id}}
            - name: JOURNEY_COMPILER_PUBLIC_KEY_BASE64
              valueFrom: {secretKeyRef: {name: {{ $.Values.global.externalSecretName }}, key: compiler-signing-public-key-base64}}
            - name: JOURNEY_COMPILER_TRUSTED_PUBLIC_KEYS
              valueFrom: {secretKeyRef: {name: {{ $.Values.global.externalSecretName }}, key: compiler-trusted-public-keys, optional: true}}
            - {name: JOURNEY_RUNTIME_ENVIRONMENT, value: {{ $.Values.global.runtimeSlot.environment | quote }}}
            - {name: JOURNEY_RUNTIME_CELL, value: {{ $.Values.global.runtimeSlot.cell | quote }}}
            - {name: JOURNEY_RUNTIME_NAMESPACE, value: {{ $.Values.global.runtimeSlot.namespace | quote }}}
            - name: JOURNEY_RUNTIME_DB_URL
              value: {{ printf "jdbc:mysql://%s:%v/%s?%s" $.Values.external.mysql.host $.Values.external.mysql.port "marketing_journey" $.Values.external.mysql.parameters | quote }}
            - name: JOURNEY_RUNTIME_DB_USER
              valueFrom: {secretKeyRef: {name: {{ $.Values.global.externalSecretName }}, key: journey-service-database-username}}
            - name: JOURNEY_RUNTIME_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $.Values.global.externalSecretName }}, key: journey-service-database-password}}
            {{- end }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
  jobManager:
    resource: {memory: 1536m, cpu: 1}
  taskManager:
    resource: {memory: 3072m, cpu: 2}
    replicas: {{ $.Values.flink.taskManagerReplicas }}
  job:
    jarURI: local://{{ $jar }}
    parallelism: {{ $.Values.flink.parallelism }}
    upgradeMode: savepoint
    state: running
{{- end }}
{{- end }}
