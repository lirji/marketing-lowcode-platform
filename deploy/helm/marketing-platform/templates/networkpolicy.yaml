{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: marketing-default-deny-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: marketing-platform}
    {{- if (index .Values.services "referral-service").enabled }}
    # NetworkPolicy规则相加；排除新服务，避免旧Ingress端口规则为它额外授权。
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: NotIn, values: [referral-service]}
    {{- end }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/part-of: marketing-platform}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8081}
        - {protocol: TCP, port: 8082}
        - {protocol: TCP, port: 8083}
        - {protocol: TCP, port: 8084}
        - {protocol: TCP, port: 8085}
        - {protocol: TCP, port: 8086}
        - {protocol: TCP, port: 8087}
        - {protocol: TCP, port: 8088}
        - {protocol: TCP, port: 8089}
{{- end }}

{{- if and .Values.networkPolicy.enabled (index .Values.services "referral-service").enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: marketing-referral-internal-only
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: referral-service, app.kubernetes.io/instance: {{ .Release.Name }}}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/part-of: marketing-platform, app.kubernetes.io/instance: {{ .Release.Name }}}}
      ports:
        - {protocol: TCP, port: {{ (index .Values.services "referral-service").port }}}
{{- end }}
