{{- if .Values.console.enabled }}
{{- $issuer := .Values.global.security.issuerUri | toString }}
{{- $oidcOrigin := regexReplaceAll "^(https?://[^/]+).*" $issuer "${1}" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: marketing-console-config
  labels:
    {{- include "marketing.labels" . | nindent 4 }}
data:
  config.js: |
    window.__MARKETING_CONFIG__ = Object.freeze({
      API_BASE_URL: {{ .Values.console.apiBaseUrl | quote }},
      DEMO_MODE: false,
      AUTH_MODE: "OIDC",
      ALLOW_DEV_AUTH: false,
      OIDC_AUTHORITY: {{ .Values.global.security.issuerUri | quote }},
      OIDC_CLIENT_ID: {{ .Values.console.oidcClientId | quote }},
      OIDC_ORGANIZATION: {{ .Values.console.oidcOrganization | quote }},
      OIDC_SCOPE: {{ .Values.console.oidcScope | quote }},
      BENEFIT_CONSOLE_ORIGIN: {{ .Values.console.benefitConsoleOrigin | default "" | quote }},
      RISK_CONSOLE_ORIGIN: {{ .Values.console.riskConsoleOrigin | default "" | quote }}
    });
  security-headers.conf: |
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' {{ $oidcOrigin }}; frame-src 'self' {{ $oidcOrigin }}; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' {{ $oidcOrigin }}" always;
    {{- if .Values.console.ingress.enabled }}
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: marketing-console
  labels:
    {{- include "marketing.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: marketing-console, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: {{ .Values.console.port }}, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing-console
  labels:
    {{- include "marketing.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.console.replicas }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app.kubernetes.io/name: marketing-console, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: marketing-console, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: marketing-platform}
      annotations: {checksum/config: {{ toJson .Values.console | sha256sum }}}
    spec:
      serviceAccountName: {{ include "marketing.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: console
          image: {{ printf "%s/%s:%s" .Values.global.imageRegistry .Values.console.image .Values.global.imageTag | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - {name: NGINX_ENVSUBST_TEMPLATE_DIR, value: /does-not-exist}
          ports: [{name: http, containerPort: {{ .Values.console.port }}}]
          startupProbe: {httpGet: {path: /healthz, port: http}, failureThreshold: 12, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 30}
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/marketing-console, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - {name: config, configMap: {name: marketing-console-config}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
        - {name: nginx-cache, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
{{- if .Values.console.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketing-console
  labels:
    {{- include "marketing.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    {{- with .Values.console.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.console.ingress.className }}
  tls:
    - hosts: [{{ .Values.console.ingress.host | quote }}]
      secretName: {{ .Values.console.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.console.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: marketing-console, port: {name: http}}}
{{- end }}
{{- end }}
