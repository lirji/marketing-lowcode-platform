global:
  imageRegistry: ghcr.io/example/marketing
  imageTag: "1.0.0"
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  security:
    mode: OIDC
    issuerUri: https://id.example.invalid/realms/marketing
    audience: marketing-api
  externalSecretName: marketing-platform-secrets
  otlpEndpoint: http://otel-collector.observability.svc:4318/v1/traces
  tracingSampleProbability: "0.05"
  runtimeSlot:
    environment: production
    cell: cell-a
    namespace: main
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector: {}

external:
  mysql:
    host: mysql.example.invalid
    port: 3306
    parameters: useSSL=true&requireSSL=true&serverTimezone=UTC
  kafka:
    bootstrapServers: kafka.example.invalid:9093
    securityProtocol: SASL_SSL
    saslMechanism: SCRAM-SHA-512
  redis:
    url: rediss://redis.example.invalid:6379
  s3:
    endpoint: https://s3.example.invalid
    region: ap-east-1
    artifactBucket: marketing-artifacts
    rawEventBucket: marketing-raw-events
  clickhouse:
    url: https://clickhouse.example.invalid:8443/marketing
  provider:
    endpoint: https://provider.example.invalid/v1/messages

serviceAccount:
  create: true
  name: ""
  annotations: {}

services:
  marketing-control-service:
    port: 8081
    database: marketing_control
    replicas: 2
  rule-compiler-worker:
    port: 8082
    database: marketing_compiler
    replicas: 2
  audience-service:
    port: 8083
    database: marketing_audience
    replicas: 2
  offer-decision-service:
    port: 8084
    database: marketing_decision
    replicas: 3
    tracingSampleProbability: "0.01"
    businessMetrics:
      pods:
        - {name: marketing_http_server_p99_milliseconds, averageValue: "24"}
        - {name: hikaricp_connections_pending, averageValue: "1"}
  benefit-funding-service:
    port: 8085
    database: marketing_benefit
    replicas: 3
    budgetBucketCount: 16
    benefitCenterBaseUrl: http://benefit-center:8083
    riskPlatformBaseUrl: http://fraud-gateway.risk-platform.svc:8082
    awardDefaultMode: LEGACY
    awardTenantModes: ""
    awardRelayEnabled: false
    awardBulkheadPermits: 64
    awardRelayTenantBatchSize: 10
    awardRelayCircuitFailureThreshold: 5
    awardRelayCircuitOpenMs: 30000
    awardEvaluationLeaseMs: 30000
    awardConcurrentWaitMs: 5000
    businessMetrics:
      pods:
        - {name: marketing_http_server_p99_milliseconds, averageValue: "120"}
        - {name: hikaricp_connections_pending, averageValue: "1"}
      external:
        - name: marketing_outbox_oldest_age_seconds
          targetType: Value
          value: "30"
          matchLabels: {service: benefit-funding-service}
  event-gateway-service:
    port: 8086
    database: marketing_events
    replicas: 3
    outbox:
      maxPending: 1000000
      maxPendingPerTenant: 100000
      maxOldestAgeSeconds: 300
      backpressureRefreshMs: 250
      backpressureMaxCachedTenants: 10000
    businessMetrics:
      pods:
        - {name: marketing_http_server_p99_milliseconds, averageValue: "160"}
        - {name: hikaricp_connections_pending, averageValue: "1"}
      external:
        - name: marketing_outbox_pending
          targetType: Value
          value: "200000"
          matchLabels: {service: event-gateway-service}
        - name: marketing_outbox_oldest_age_seconds
          targetType: Value
          value: "30"
          matchLabels: {service: event-gateway-service}
  journey-service:
    port: 8087
    database: marketing_journey
    replicas: 2
    businessMetrics:
      external:
        - name: marketing_kafka_consumer_lag
          averageValue: "5000"
          matchLabels: {consumer_group: mk-journey-output-projector-v1}
  engagement-service:
    port: 8088
    database: marketing_engagement
    replicas: 2
    businessMetrics:
      pods:
        - {name: hikaricp_connections_pending, averageValue: "1"}
      external:
        - name: marketing_kafka_consumer_lag
          averageValue: "5000"
          matchLabels: {consumer_group: mk-engagement-journey-effects-v1}
  measurement-service:
    port: 8089
    database: marketing_measurement
    replicas: 2
  # 新裂变默认不部署；真实来源/账号/容量需另行签收。
  referral-service:
    enabled: false
    port: 8090
    database: marketing_referral
    replicas: 1
    hpa: {enabled: false}
  edge-gateway:
    port: 8080
    database: ""
    replicas: 3
    gateway:
      redisConnectTimeout: 500ms
      redisCommandTimeout: 500ms
      connectTimeout: 1s
      responseTimeout: 3s
      rateLimit:
        eventsPerSecond: 10000
        eventsBurst: 10000
        decisionsPerSecond: 30000
        decisionsBurst: 30000
        writesPerSecond: 2000
        writesBurst: 4000
        readsPerSecond: 5000
        readsBurst: 10000

defaults:
  resources:
    requests: {cpu: 200m, memory: 384Mi}
    limits: {cpu: "2", memory: 1536Mi}
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 12
    cpuUtilization: 65
    memoryUtilization: 75
  pdb:
    enabled: true
    maxUnavailable: 1
  terminationGracePeriodSeconds: 45

autoscaling:
  businessMetrics:
    # 生产集群安装并验证 Prometheus Adapter 指标规则后启用；CPU/内存始终保留为兜底信号。
    enabled: false

releasePolicy:
  maxReadyCapacityPerRuntime: 1000

console:
  enabled: true
  replicas: 2
  image: console
  port: 8080
  apiBaseUrl: ""
  oidcClientId: marketing-console
  oidcOrganization: ""
  oidcScope: openid profile email
  benefitConsoleOrigin: ""
  riskConsoleOrigin: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  ingress:
    enabled: true
    className: nginx
    host: marketing.example.invalid
    tlsSecretName: marketing-console-tls
    annotations: {}

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

flink:
  enabled: false
  image: flink-jobs
  createServiceAccount: true
  serviceAccount: marketing-flink
  serviceAccountAnnotations: {}
  parallelism: 4
  taskManagerReplicas: 2
  taskSlots: 4
  checkpointInterval: 30s
  checkpointStorage: s3://marketing-flink/checkpoints
  savepointStorage: s3://marketing-flink/savepoints
  highAvailabilityStorage: s3://marketing-flink/ha
  jobs:
    audience: /opt/flink/usrlib/audience.jar
    journey: /opt/flink/usrlib/journey.jar
    measurement: /opt/flink/usrlib/measurement.jar
