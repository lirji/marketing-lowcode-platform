server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  # Casdoor access token 含完整 permission 对象，Authorization 约 20KB+。
  client_header_buffer_size 32k;
  large_client_header_buffers 4 64k;
  include /etc/marketing-console/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 200 "ok\n";
  }

  location = /client-error {
    limit_except POST { deny all; }
    add_header Cache-Control "no-store" always;
    include /etc/marketing-console/security-headers.conf;
    return 204;
  }

  location = /config.js {
    alias /etc/marketing-console/config.js;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    include /etc/marketing-console/security-headers.conf;
  }

  location /api/ {
    proxy_pass http://edge-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_buffer_size 16k;
    proxy_buffers 4 64k;
  }

  location / {
    add_header Cache-Control "no-store" always;
    include /etc/marketing-console/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|svg|png|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    include /etc/marketing-console/security-headers.conf;
    try_files $uri =404;
  }
}
