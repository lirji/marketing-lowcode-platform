name: Build immutable images

on:
  push:
    tags: ["r1-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: marketing-control-service, dockerfile: deploy/docker/Dockerfile.jvm, target: service, port: 8081}
          - {name: rule-compiler-worker, dockerfile: deploy/docker/Dockerfile.jvm, target: service, port: 8082}
          - {name: audience-service, dockerfile: deploy/docker/Dockerfile.jvm, target: service, port: 8083}
          - {name: offer-decision-service, dockerfile: deploy/docker/Dockerfile.jvm, target: service, port: 8084}
          - {name: benefit-funding-service, dockerfile: deploy/docker/Dockerfile.jvm, target: service, port: 8085}
          - {name: event-gateway-service, dockerfile: deploy/docker/Dockerfile.jvm, target: service, port: 8086}
          - {name: journey-service, dockerfile: deploy/docker/Dockerfile.jvm, target: service, port: 8087}
          - {name: engagement-service, dockerfile: deploy/docker/Dockerfile.jvm, target: service, port: 8088}
          - {name: measurement-service, dockerfile: deploy/docker/Dockerfile.jvm, target: service, port: 8089}
          - {name: edge-gateway, dockerfile: deploy/docker/Dockerfile.jvm, target: service, port: 8080}
          - {name: flink-jobs, dockerfile: deploy/docker/Dockerfile.jvm, target: flink-jobs, port: 8081}
          - {name: console, dockerfile: deploy/docker/Dockerfile.console, target: "", port: 8080}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/marketing/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            SERVICE=${{ matrix.name }}
            SERVICE_PORT=${{ matrix.port }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/marketing/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
