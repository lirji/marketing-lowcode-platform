name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java, contracts and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify reactor
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Validate machine contracts
        run: ./scripts/verify-contracts.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Console lint, unit, build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9.15.9}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.7.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm frontend:lint
      - run: pnpm frontend:test
      - run: pnpm frontend:build
      - run: pnpm --filter @marketing/console exec playwright install --with-deps chromium
      - run: pnpm frontend:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/apps/console/playwright-report
          retention-days: 14

  deployment:
    name: Compose and Helm render
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEV_INFRA_ROOT: ${{ github.workspace }}/dev-infra
    steps:
      - uses: actions/checkout@v4
      - name: Check out shared development infrastructure
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/dev-infra
          path: dev-infra
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with: {version: v4.1.0}
      - run: chmod +x scripts/*.sh scripts/capacity.py dev-infra/bin/marketing-infra dev-infra/marketing/mysql/01-databases.sh dev-infra/marketing/kafka/create-topics.sh
      - run: ./scripts/verify-deployment.sh
      - name: Validate every Flyway migration on MySQL 8.4
        run: ./scripts/verify-mysql-migrations.sh
