server.max-http-request-header-size: 64KB
server.port: ${PORT:8085}
spring:
  application.name: benefit-funding-service
  datasource:
    url: "${MARKETING_DB_URL:jdbc:mysql://127.0.0.1:43306/marketing_benefit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: ${MARKETING_DB_USER:benefit_app}
    password: ${BENEFIT_DB_PASSWORD:${MARKETING_DB_PASSWORD:}}
  flyway:
    locations: classpath:db/migration
    user: ${SPRING_FLYWAY_USER:benefit_migrator}
    password: ${SPRING_FLYWAY_PASSWORD:${BENEFIT_MIGRATION_DB_PASSWORD:}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: false
marketing.kafka.consumers-enabled: ${MARKETING_KAFKA_CONSUMERS_ENABLED:false}
marketing.trade-receipts:
  enabled: ${MARKETING_TRADE_RECEIPTS_ENABLED:false}
  topic-prefix: ${MARKETING_TRADE_RECEIPTS_TOPIC_PREFIX:}
  consumer-group: ${MARKETING_TRADE_RECEIPTS_CONSUMER_GROUP:mk-trade-receipts-v1}
marketing.trade-order-bindings:
  enabled: ${MARKETING_TRADE_ORDER_BINDINGS_ENABLED:false}
  sources: ${MARKETING_TRADE_ORDER_BINDING_SOURCES:}
  casdoor:
    enabled: ${MARKETING_TRADE_ORDER_BINDING_CASDOOR_ENABLED:false}
    issuer-uri: ${MARKETING_TRADE_ORDER_BINDING_CASDOOR_ISSUER_URI:}
    jwk-set-uri: ${MARKETING_TRADE_ORDER_BINDING_CASDOOR_JWK_SET_URI:}
    grants: ${MARKETING_TRADE_ORDER_BINDING_CASDOOR_GRANTS:[]}
marketing.checkout-funding:
  enabled: ${CHECKOUT_FUNDING_ENABLED:false}
  accept-new: ${CHECKOUT_FUNDING_ACCEPT_NEW:true}
  trade-base-url: ${CHECKOUT_FUNDING_TRADE_BASE_URL:}
  trade-token: ${CHECKOUT_FUNDING_TRADE_TOKEN:}
  key-id: ${CHECKOUT_FUNDING_KEY_ID:}
  private-key: ${CHECKOUT_FUNDING_PRIVATE_KEY:}
  public-key: ${CHECKOUT_FUNDING_PUBLIC_KEY:}
  actor: ${CHECKOUT_FUNDING_ACTOR:}
  tenant: ${CHECKOUT_FUNDING_TENANT:}
  trade-tenant: ${CHECKOUT_FUNDING_TRADE_TENANT:}
  organization: ${CHECKOUT_FUNDING_ORGANIZATION:}
  shop: ${CHECKOUT_FUNDING_SHOP:}
  store: ${CHECKOUT_FUNDING_STORE:}
  campaign: ${CHECKOUT_FUNDING_CAMPAIGN:}
  scope-version: ${CHECKOUT_FUNDING_SCOPE_VERSION:}
  funder: ${CHECKOUT_FUNDING_FUNDER:}
marketing.benefit.outbox-enabled: ${MARKETING_BENEFIT_OUTBOX_ENABLED:false}
marketing.funding.budget-bucket-count: ${MARKETING_FUNDING_BUDGET_BUCKET_COUNT:16}
marketing.benefit-center:
  base-url: ${BENEFIT_CENTER_BASE_URL:http://127.0.0.1:8183}
  bearer-token: ${BENEFIT_CENTER_BEARER_TOKEN:}
  fulfillment-bearer-token: ${BENEFIT_CENTER_FULFILLMENT_BEARER_TOKEN:}
  connect-timeout-ms: ${BENEFIT_CENTER_CONNECT_TIMEOUT_MS:2000}
  request-timeout-ms: ${BENEFIT_CENTER_REQUEST_TIMEOUT_MS:3000}
  cache-ttl-seconds: ${BENEFIT_CENTER_CACHE_TTL_SECONDS:20}
marketing.award:
  # fail-safe：默认旧链路；仅 tenant-modes 中显式配置 tenant=CENTER 才会真实调用权益中台。
  default-mode: ${MARKETING_AWARD_DEFAULT_MODE:LEGACY}
  tenant-modes: ${MARKETING_AWARD_TENANT_MODES:}
  relay-enabled: ${MARKETING_AWARD_RELAY_ENABLED:false}
  # 独立读取权限，GET 必须使用与目标租户一致且含 benefit.award.read 的凭据。
  fulfillment-enabled: ${MARKETING_AWARD_FULFILLMENT_ENABLED:false}
  fulfillment-max-failures: ${MARKETING_AWARD_FULFILLMENT_MAX_FAILURES:10}
  fulfillment-batch-size: ${MARKETING_AWARD_FULFILLMENT_BATCH_SIZE:5}
  fulfillment-lease-ms: ${MARKETING_AWARD_FULFILLMENT_LEASE_MS:30000}
  fulfillment-refresh-seconds: ${MARKETING_AWARD_FULFILLMENT_REFRESH_SECONDS:300}
  fulfillment-delay-ms: ${MARKETING_AWARD_FULFILLMENT_DELAY_MS:5000}
  fulfillment-initial-delay-ms: ${MARKETING_AWARD_FULFILLMENT_INITIAL_DELAY_MS:5000}
  bulkhead-permits: ${MARKETING_AWARD_BULKHEAD_PERMITS:64}
  bulkhead-wait-ms: ${MARKETING_AWARD_BULKHEAD_WAIT_MS:5}
  evaluation-lease-ms: ${MARKETING_AWARD_EVALUATION_LEASE_MS:30000}
  concurrent-wait-ms: ${MARKETING_AWARD_CONCURRENT_WAIT_MS:5000}
  relay-batch-size: ${MARKETING_AWARD_RELAY_BATCH_SIZE:100}
  relay-tenant-batch-size: ${MARKETING_AWARD_RELAY_TENANT_BATCH_SIZE:10}
  relay-max-attempts: ${MARKETING_AWARD_RELAY_MAX_ATTEMPTS:10}
  relay-circuit-failure-threshold: ${MARKETING_AWARD_RELAY_CIRCUIT_FAILURE_THRESHOLD:5}
  relay-circuit-open-ms: ${MARKETING_AWARD_RELAY_CIRCUIT_OPEN_MS:30000}
  relay-delay-ms: ${MARKETING_AWARD_RELAY_DELAY_MS:5000}
  relay-initial-delay-ms: ${MARKETING_AWARD_RELAY_INITIAL_DELAY_MS:5000}
  relay-lease-ms: ${MARKETING_AWARD_RELAY_LEASE_MS:30000}
marketing.risk:
  base-url: ${RISK_PLATFORM_BASE_URL:http://127.0.0.1:8082}
  bearer-token: ${RISK_PLATFORM_BEARER_TOKEN:}
  connect-timeout-ms: ${RISK_CONNECT_TIMEOUT_MS:500}
  request-timeout-ms: ${RISK_REQUEST_TIMEOUT_MS:1000}
  bulkhead-permits: ${RISK_BULKHEAD_PERMITS:16}
  bulkhead-wait-ms: ${RISK_BULKHEAD_WAIT_MS:5}
  thread-count: ${RISK_THREAD_COUNT:16}
  queue-capacity: ${RISK_QUEUE_CAPACITY:64}
  circuit-failure-threshold: ${RISK_CIRCUIT_FAILURE_THRESHOLD:5}
  circuit-open-ms: ${RISK_CIRCUIT_OPEN_MS:30000}
marketing.offer.trusted-public-keys: ${MARKETING_OFFER_TRUSTED_PUBLIC_KEYS:}
marketing.security:
  mode: ${MARKETING_SECURITY_MODE:DEV}
  dev-headers-enabled: ${MARKETING_DEV_HEADERS_ENABLED:true}
management.endpoints.web.exposure.include: health,info,prometheus
server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
management.endpoint.health.probes.enabled: true
management.tracing.sampling.probability: ${TRACING_SAMPLE_PROBABILITY:0.05}
management.opentelemetry.tracing.limits.max-attributes: 64
management.opentelemetry.tracing.limits.max-attribute-value-length: 256
management.opentelemetry.tracing.export.max-queue-size: 2048
management.opentelemetry.tracing.export.max-batch-size: 256
marketing.expiration:
  enabled: ${MARKETING_EXPIRATION_ENABLED:true}
  fixed-delay-ms: ${MARKETING_EXPIRATION_FIXED_DELAY_MS:1000}

marketing.funding-audit-archive:
  enabled: ${FUNDING_AUDIT_ARCHIVE_ENABLED:false}
  recovery-enabled: ${FUNDING_AUDIT_ARCHIVE_RECOVERY_ENABLED:false}
  online-cutover-enabled: ${FUNDING_AUDIT_ARCHIVE_ONLINE_CUTOVER_ENABLED:false}
  recovery-replay-enabled: ${FUNDING_AUDIT_ARCHIVE_RECOVERY_REPLAY_ENABLED:false}
  scheduler-enabled: ${FUNDING_AUDIT_ARCHIVE_SCHEDULER_ENABLED:false}
  tenant: ${FUNDING_AUDIT_ARCHIVE_TENANT:}
  minimum-age: ${FUNDING_AUDIT_ARCHIVE_MINIMUM_AGE:P90D}
  endpoint: ${FUNDING_AUDIT_ARCHIVE_ENDPOINT:}
  bucket: ${FUNDING_AUDIT_ARCHIVE_BUCKET:}
  region: ${FUNDING_AUDIT_ARCHIVE_REGION:us-east-1}
  write-key: ${FUNDING_AUDIT_ARCHIVE_WRITE_KEY:}
  write-secret: ${FUNDING_AUDIT_ARCHIVE_WRITE_SECRET:}
  restore-key: ${FUNDING_AUDIT_ARCHIVE_RESTORE_KEY:}
  restore-secret: ${FUNDING_AUDIT_ARCHIVE_RESTORE_SECRET:}
  scheduler-admin: ${FUNDING_AUDIT_ARCHIVE_SCHEDULER_ADMIN:}
  scheduler-token: ${FUNDING_AUDIT_ARCHIVE_SCHEDULER_TOKEN:}
  scheduler-port: ${FUNDING_AUDIT_ARCHIVE_SCHEDULER_PORT:10085}
