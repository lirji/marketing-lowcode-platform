server.max-http-request-header-size: 64KB
server.port: ${PORT:8084}
spring:
  application.name: offer-decision-service
  datasource:
    url: "${MARKETING_DB_URL:jdbc:mysql://127.0.0.1:43306/marketing_decision?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: ${MARKETING_DB_USER:decision_app}
    password: ${DECISION_DB_PASSWORD:${MARKETING_DB_PASSWORD:}}
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${SPRING_FLYWAY_USER:decision_migrator}
    password: ${SPRING_FLYWAY_PASSWORD:${DECISION_MIGRATION_DB_PASSWORD:}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${DECISION_AUDIENCE_CONSUMER_GROUP:mk-decision-audience-projection-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
  data.redis.url: ${REDIS_URL:redis://localhost:6379}
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
marketing.security:
  mode: ${MARKETING_SECURITY_MODE:DEV}
  dev-headers-enabled: ${MARKETING_DEV_HEADERS_ENABLED:true}
marketing.runtime:
  environment: ${MARKETING_RUNTIME_ENVIRONMENT:local}
  cell: ${MARKETING_RUNTIME_CELL:cell-a}
  namespace: ${MARKETING_RUNTIME_NAMESPACE:main}
marketing.kafka.consumers-enabled: ${MARKETING_KAFKA_CONSUMERS_ENABLED:false}
marketing.decision.idempotency-store: ${MARKETING_DECISION_IDEMPOTENCY_STORE:JDBC}
marketing.release.trusted-public-keys: ${MARKETING_RELEASE_TRUSTED_PUBLIC_KEYS:}
marketing.compiler.trusted-public-keys: ${MARKETING_COMPILER_TRUSTED_PUBLIC_KEYS:}
management.endpoints.web.exposure.include: health,info,prometheus
server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
management.endpoint.health.probes.enabled: true
management.endpoint.health.group.readiness.include: readinessState,decisionRuntime
management.tracing.sampling.probability: ${TRACING_SAMPLE_PROBABILITY:0.01}
management.opentelemetry.tracing.limits.max-attributes: 64
management.opentelemetry.tracing.limits.max-attribute-value-length: 256
management.opentelemetry.tracing.export.max-queue-size: 2048
management.opentelemetry.tracing.export.max-batch-size: 256
# 参与信任默认关闭；不能复用OfferToken或Control角色的签名配置。
marketing.participation.trusted-key-id: ${MARKETING_PARTICIPATION_TRUSTED_KEY_ID:}
marketing.participation.public-key-base64: ${MARKETING_PARTICIPATION_PUBLIC_KEY_BASE64:}
marketing.participation.trusted-public-keys: ${MARKETING_PARTICIPATION_TRUSTED_PUBLIC_KEYS:}
# 独立私钥缺省不配置；应用指针未建立时此入口仍拒绝新参与。
marketing.participation.signing-key-id: ${MARKETING_PARTICIPATION_SIGNING_KEY_ID:}
marketing.participation.private-key-base64: ${MARKETING_PARTICIPATION_PRIVATE_KEY_BASE64:}
marketing.participation.signing-public-key-base64: ${MARKETING_PARTICIPATION_SIGNING_PUBLIC_KEY_BASE64:}

marketing.deployment-inventory:
  trusted-public-keys: ${DECISION_DEPLOYMENT_TRUSTED_PUBLIC_KEYS:}
  tenant: ${DECISION_DEPLOYMENT_PIPELINE_TENANT:}
  actor: ${DECISION_DEPLOYMENT_PIPELINE_ACTOR:}

# 试点只允许明确配对的交易签价机器和业务范围。
marketing.checkout-pilot:
  enabled: ${MARKETING_CHECKOUT_PILOT_ENABLED:false}
  tenant: ${MARKETING_CHECKOUT_PILOT_TENANT:}
  actor: ${MARKETING_CHECKOUT_PILOT_ACTOR:}
  organization: ${MARKETING_CHECKOUT_PILOT_ORGANIZATION:}
  shop: ${MARKETING_CHECKOUT_PILOT_SHOP:}
  campaign: ${MARKETING_CHECKOUT_PILOT_CAMPAIGN:}
  scope-version: ${MARKETING_CHECKOUT_PILOT_SCOPE_VERSION:}
  sku: ${MARKETING_CHECKOUT_PILOT_SKU:}
  funder: ${MARKETING_CHECKOUT_PILOT_FUNDER:}
  trade-tenant: ${MARKETING_CHECKOUT_PILOT_TRADE_TENANT:}

# 实例专用身份由部署方注入，每个接流量实例持有独立私钥；目标作业身份取自受信部署配置。
marketing.execution:
  instance-id: ${DECISION_EXECUTION_INSTANCE_ID:}
  image-digest: ${DECISION_EXECUTION_IMAGE_DIGEST:}
  key-id: ${DECISION_EXECUTION_KEY_ID:}
  private-key: ${DECISION_EXECUTION_PRIVATE_KEY_BASE64:}
  trusted-public-keys: ${DECISION_EXECUTION_TRUSTED_PUBLIC_KEYS:}
  journey-public-keys: ${DECISION_JOURNEY_EXECUTION_TRUSTED_PUBLIC_KEYS:}
  journey-targets: ${DECISION_JOURNEY_EXECUTION_TARGETS:}
  admission-namespace: ${DECISION_ADMISSION_NAMESPACE:main}
