server.max-http-request-header-size: 64KB
server.port: ${PORT:8087}
spring:
  application.name: journey-service
  datasource:
    url: "${MARKETING_DB_URL:jdbc:mysql://127.0.0.1:43306/marketing_journey?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: ${MARKETING_DB_USER:journey_app}
    password: ${JOURNEY_DB_PASSWORD:${MARKETING_DB_PASSWORD:}}
  flyway:
    locations: classpath:db/migration
    user: ${SPRING_FLYWAY_USER:journey_migrator}
    password: ${SPRING_FLYWAY_PASSWORD:${JOURNEY_MIGRATION_DB_PASSWORD:}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
marketing.kafka.consumers-enabled: ${MARKETING_KAFKA_CONSUMERS_ENABLED:false}
marketing.journey.dispatch-enabled: ${MARKETING_JOURNEY_DISPATCH_ENABLED:false}
marketing.journey.execution-mode: ${MARKETING_JOURNEY_EXECUTION_MODE:DIRECT}
marketing.security:
  mode: ${MARKETING_SECURITY_MODE:DEV}
  dev-headers-enabled: ${MARKETING_DEV_HEADERS_ENABLED:true}
marketing.release:
  trusted-key-id: ${MARKETING_RELEASE_TRUSTED_KEY_ID:}
  public-key-base64: ${MARKETING_RELEASE_PUBLIC_KEY_BASE64:}
  trusted-public-keys: ${MARKETING_RELEASE_TRUSTED_PUBLIC_KEYS:}
marketing.compiler:
  trusted-key-id: ${MARKETING_COMPILER_TRUSTED_KEY_ID:}
  public-key-base64: ${MARKETING_COMPILER_PUBLIC_KEY_BASE64:}
  trusted-public-keys: ${MARKETING_COMPILER_TRUSTED_PUBLIC_KEYS:}
marketing.runtime-ack:
  signing-key-id: ${MARKETING_RUNTIME_ACK_SIGNING_KEY_ID:}
  private-key-base64: ${MARKETING_RUNTIME_ACK_PRIVATE_KEY_BASE64:}
  public-key-base64: ${MARKETING_RUNTIME_ACK_PUBLIC_KEY_BASE64:}
marketing.runtime:
  environment: ${MARKETING_RUNTIME_ENVIRONMENT:local}
  cell: ${MARKETING_RUNTIME_CELL:cell-a}
  namespace: ${MARKETING_RUNTIME_NAMESPACE:main}
  id: ${MARKETING_RUNTIME_ID:journey-local}
  build-digest: ${MARKETING_RUNTIME_BUILD_DIGEST:development}
  capacity: ${MARKETING_RUNTIME_CAPACITY:1000}
management.endpoints.web.exposure.include: health,info,prometheus
server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
management.endpoint.health.probes.enabled: true
management.tracing.sampling.probability: ${TRACING_SAMPLE_PROBABILITY:0.05}
management.opentelemetry.tracing.limits.max-attributes: 64
management.opentelemetry.tracing.limits.max-attribute-value-length: 256
management.opentelemetry.tracing.export.max-queue-size: 2048
management.opentelemetry.tracing.export.max-batch-size: 256
