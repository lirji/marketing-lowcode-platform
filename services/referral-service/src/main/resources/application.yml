spring:
  application.name: referral-service
  datasource:
    url: ${REFERRAL_DB_URL}
    username: ${REFERRAL_DB_USER}
    password: ${REFERRAL_DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
    user: ${REFERRAL_MIGRATION_DB_USER}
    password: ${REFERRAL_MIGRATION_DB_PASSWORD}
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
marketing:
  security:
    mode: OIDC
    dev-headers-enabled: false
  referral:
    subject-key-version: 0
    invite-replay-seconds: 0
management.endpoints.web.exposure.include: health,info,prometheus
management.endpoint.health.probes.enabled: true
management.endpoint.health.group.readiness.include: readinessState,db
server.port: ${PORT:8090}
server.shutdown: graceful
# 首次授权必须同时接通可信证明适配器；零上界默认拒绝，不能靠打开配置伪造ALLOW。
marketing.referral.authorization.max-dependencies: ${REFERRAL_AUTHORIZATION_MAX_DEPENDENCIES:0}
marketing.referral.authorization.max-proof-seconds: ${REFERRAL_AUTHORIZATION_MAX_PROOF_SECONDS:0}

marketing.referral.fulfillment.max-proof-seconds: ${REFERRAL_FULFILLMENT_MAX_PROOF_SECONDS:0}
